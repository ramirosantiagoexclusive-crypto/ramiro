<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2.5D Adventure - Улучшенный геймплей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a2a22;
            overflow: hidden;
            touch-action: none;
            font-family: system-ui, 'Segoe UI', monospace;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .joystick-area {
            position: fixed;
            bottom: 0;
            width: 50%;
            height: 50%;
            touch-action: none;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .move-area { left: 0; }
        .attack-area { right: 0; }
        .ui {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            z-index: 200;
            pointer-events: none;
            display: flex;
            gap: 12px;
            font-size: 11px;
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
        }
        .weapon-info {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 20px;
            color: #ffcc66;
            font-weight: bold;
            z-index: 200;
            pointer-events: none;
            font-size: 11px;
            backdrop-filter: blur(4px);
        }
        .reload-bar {
            position: fixed;
            bottom: 120px;
            right: 30px;
            width: 60px;
            height: 6px;
            background: #444;
            border-radius: 3px;
            overflow: hidden;
            z-index: 200;
        }
        .reload-fill {
            width: 100%;
            height: 100%;
            background: #ffaa44;
            transition: width 0.05s;
        }
        .buff-indicator {
            position: fixed;
            bottom: 80px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 12px;
            color: #aaf;
            font-size: 10px;
            z-index: 200;
            pointer-events: none;
            backdrop-filter: blur(4px);
            max-width: 40%;
        }
        .combo-counter {
            position: fixed;
            bottom: 140px;
            right: 30px;
            background: rgba(0,0,0,0.7);
            padding: 4px 10px;
            border-radius: 20px;
            color: #ffaa44;
            font-weight: bold;
            font-size: 16px;
            z-index: 200;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        .wave-indicator {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            color: #ffaa88;
            font-weight: bold;
            font-size: 12px;
            z-index: 200;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .level-up-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 20px;
            border-radius: 30px;
            z-index: 400;
            display: none;
            flex-direction: column;
            gap: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid #ffaa44;
            min-width: 250px;
        }
        .level-up-panel h3 { color: #ffaa44; margin-bottom: 10px; }
        .level-up-btn {
            background: #2a2a2a;
            color: white;
            border: 1px solid #ffaa44;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.1s;
        }
        .level-up-btn:active { background: #ffaa44; color: black; transform: scale(0.96); }
        .death-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }
        .death-window {
            background: #2a1f1a;
            padding: 20px 30px;
            border-radius: 30px;
            text-align: center;
            color: #ffaa88;
            border: 2px solid #ff8844;
        }
        .death-window button {
            background: #ff8844;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .instruction {
            position: fixed;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            color: #ccc;
            font-size: 9px;
            background: rgba(0,0,0,0.4);
            width: fit-content;
            margin: 0 auto;
            padding: 2px 8px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 200;
        }
        @media (max-width: 700px) {
            .ui, .weapon-info { font-size: 9px; gap: 6px; }
            .combo-counter { bottom: 110px; font-size: 14px; }
            .wave-indicator { font-size: 10px; top: 60px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="joystick-area move-area" id="moveArea"></div>
    <div class="joystick-area attack-area" id="attackArea"></div>
    
    <div class="ui">
        <span>❤️ <span id="hp">100</span></span>
        <span>🧟 <span id="kills">0</span></span>
        <span>⭐ Lv.<span id="level">1</span></span>
        <span>⚡ <span id="speedBuff">0</span>%</span>
        <span>🛡️ <span id="armorBuff">0</span></span>
    </div>
    <div class="weapon-info" id="weaponInfo">🗡️ Меч (28)</div>
    <div class="reload-bar"><div class="reload-fill" id="reloadFill"></div></div>
    <div class="buff-indicator" id="buffIndicator">✨ Нет баффов</div>
    <div class="combo-counter" id="comboCounter">🔥 0 комбо</div>
    <div class="wave-indicator" id="waveIndicator">Волна 1</div>
    <div class="instruction">👉 Левая зона — движение | Правая зона — атака (направление от центра)</div>
    <div class="level-up-panel" id="levelUpPanel">
        <h3>🎉 УРОВЕНЬ ПОВЫШЕН!</h3>
        <button class="level-up-btn" id="upgradeDamage">⚔️ +5 урона</button>
        <button class="level-up-btn" id="upgradeSpeed">🏃 +10% скорости</button>
        <button class="level-up-btn" id="upgradeHealth">❤️ +15 макс. здоровья</button>
        <button class="level-up-btn" id="upgradeAttackSpeed">⚡ -10% задержки атаки</button>
    </div>

    <script>
        (function(){
            const WORLD_W = 2600, WORLD_H = 2300;
            const PLAYER_W = 34, PLAYER_H = 34;
            const BASE_SPEED = 5.2;
            
            let canvas = document.getElementById('canvas');
            let ctx = canvas.getContext('2d');
            let gameActive = true;
            let lastTimestamp = 0;
            
            let player = {
                x: WORLD_W/2, y: WORLD_H/2,
                dirX: 0, dirY: 1,
                anim: 0,
                hp: 100, maxHp: 100,
                invTimer: 0,
                kills: 0,
                speedBonus: 0,
                armorBonus: 0,
                level: 1,
                experience: 0,
                expToNext: 100,
                damageBonus: 0,
                attackSpeedBonus: 0  // уменьшает задержку оружия
            };
            
            // Оружие (урон базовый + бонус)
            const weaponsLib = [
                { type:0, name:"Меч", baseDamage:28, delay:0.5, range:75, projSpeed:0, color:"#c0a16b", emoji:"🗡️", knockback:45, projectileEffect: null },
                { type:1, name:"Арбалет", baseDamage:18, delay:0.7, range:500, projSpeed:9, color:"#b87c4f", emoji:"🏹", knockback:0, projectileEffect: null },
                { type:2, name:"Посох", baseDamage:42, delay:1.1, range:550, projSpeed:7, color:"#ff8844", emoji:"🔮", knockback:25, projectileEffect: "fire" },
                { type:3, name:"Кинжал", baseDamage:22, delay:0.35, range:60, projSpeed:0, color:"#cdb", emoji:"🗡️", knockback:30, projectileEffect: null }
            ];
            let weaponIndex = 0;
            let weapon = { ...weaponsLib[0], cd: 0, damage: weaponsLib[0].baseDamage };
            
            let enemies = [];
            let projectiles = [];
            let enemyProjectiles = [];
            let particles = [];
            let items = [];      // {x,y,type} type: medkit, speedPotion, armorPotion, ragePotion, powerup_attack, powerup_invincible, magnet
            let powerups = [];   // активные пауэр-апы
            let walls = [];
            let decor = [];
            
            let wave = 1;
            let waveTimer = 0;
            let waveDuration = 30;
            let waveBonusGiven = false;
            
            let spawnTimer = 0;
            let camera = { x:0, y:0 };
            let moveVec = {x:0, y:0};
            let meleeSwing = { active: false, angle: 0, timer: 0, duration: 0.15, x:0, y:0 };
            
            // Типы врагов (как ранее, добавим сопротивляемость)
            const enemyTypes = {
                normal: { hp: 45, speed: 1.3, damage: 12, color: "#4a6e5c", size: 32, exp: 10, name: "Гниль", knockbackResist: 0 },
                fast:   { hp: 30, speed: 2.2, damage: 10, color: "#c44", size: 32, exp: 12, name: "Шустрый", knockbackResist: 0 },
                tank:   { hp: 100, speed: 0.8, damage: 15, color: "#48a", size: 38, exp: 20, name: "Танк", knockbackResist: 0.6 },
                mage:   { hp: 35, speed: 1.0, damage: 18, color: "#a5a", size: 32, exp: 15, name: "Маг", ranged: true, projDamage: 14, projSpeed: 5, knockbackResist: 0 },
                berserk:{ hp: 55, speed: 1.8, damage: 20, color: "#e74", size: 34, exp: 18, name: "Берсерк", knockbackResist: 0.2 },
                summoner:{ hp: 40, speed: 0.9, damage: 8, color: "#6a8", size: 36, exp: 25, name: "Призыватель", summonCooldown: 0, knockbackResist: 0.2 },
                exploder:{ hp: 25, speed: 1.5, damage: 25, color: "#f84", size: 30, exp: 15, name: "Камикадзе", explode: true, knockbackResist: 0 }
            };
            
            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeCanvas); resizeCanvas();
            
            // --- КЛАСС ВРАГА (с поддержкой эффектов, например горение) ---
            class Enemy {
                constructor(x, y, typeKey) {
                    const t = enemyTypes[typeKey];
                    this.typeKey = typeKey;
                    this.x = x; this.y = y;
                    this.w = t.size; this.h = t.size;
                    this.hp = t.hp;
                    this.maxHp = t.hp;
                    this.speed = t.speed;
                    this.damage = t.damage;
                    this.color = t.color;
                    this.name = t.name;
                    this.exp = t.exp;
                    this.attackTimer = 0;
                    this.ranged = t.ranged || false;
                    this.projDamage = t.projDamage || 0;
                    this.projSpeed = t.projSpeed || 0;
                    this.summonCooldown = (typeKey === 'summoner') ? 0 : null;
                    this.explode = t.explode || false;
                    this.knockbackResist = t.knockbackResist || 0;
                    this.hitFlash = 0;
                    this.burning = 0;   // длительность горения
                }
                
                update(delta) {
                    if (this.burning > 0) {
                        this.hp -= 5 * delta;
                        this.burning -= delta;
                        if (this.burning > 0) {
                            for(let i=0;i<2;i++) particles.push({ x: this.x+this.w/2+(Math.random()-0.5)*15, y: this.y+this.h/2+(Math.random()-0.5)*15, life:0.1, vx:0, vy:0, color:"#ff6600" });
                        }
                    }
                    
                    let dx = player.x + PLAYER_W/2 - (this.x + this.w/2);
                    let dy = player.y + PLAYER_H/2 - (this.y + this.h/2);
                    let len = Math.hypot(dx, dy);
                    if(len > 0.1) {
                        dx /= len; dy /= len;
                        this.x += dx * this.speed;
                        this.y += dy * this.speed;
                    }
                    this.x = Math.min(Math.max(this.x, 0), WORLD_W - this.w);
                    this.y = Math.min(Math.max(this.y, 0), WORLD_H - this.h);
                    
                    const distToPlayer = Math.hypot(this.x+this.w/2 - (player.x+PLAYER_W/2), this.y+this.h/2 - (player.y+PLAYER_H/2));
                    if (this.explode && distToPlayer < 45 && player.invTimer <= 0) {
                        player.hp -= this.damage;
                        player.invTimer = 0.5;
                        for(let i=0;i<20;i++) particles.push({ x: this.x+this.w/2, y: this.y+this.h/2, life:0.5, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, color:"#ff8800" });
                        this.hp = 0;
                        return;
                    }
                    if (!this.ranged && this.attackTimer <= 0 && distToPlayer < 45) {
                        let finalDamage = this.damage - player.armorBonus;
                        if (finalDamage < 3) finalDamage = 3;
                        if (player.invTimer <= 0) {
                            player.hp -= finalDamage;
                            player.invTimer = 0.6;
                        }
                        this.attackTimer = 0.8;
                        for(let i=0;i<8;i++) particles.push({ x: player.x+PLAYER_W/2+(Math.random()-0.5)*20, y: player.y+PLAYER_H/2+(Math.random()-0.5)*20, life:0.2, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3, color:"#a00" });
                    }
                    if (this.ranged && this.attackTimer <= 0 && distToPlayer < 300) {
                        let angle = Math.atan2(player.y+PLAYER_H/2 - (this.y+this.h/2), player.x+PLAYER_W/2 - (this.x+this.w/2));
                        let vx = Math.cos(angle) * this.projSpeed;
                        let vy = Math.sin(angle) * this.projSpeed;
                        enemyProjectiles.push({ x: this.x+this.w/2, y: this.y+this.h/2, vx: vx, vy: vy, damage: this.projDamage, size: 8, color: "#f66" });
                        this.attackTimer = 1.2;
                    }
                    if (this.typeKey === 'summoner' && this.summonCooldown <= 0 && enemies.length < 25) {
                        let angle = Math.random() * Math.PI * 2;
                        let summonX = this.x + Math.cos(angle) * 70;
                        let summonY = this.y + Math.sin(angle) * 70;
                        summonX = Math.min(Math.max(summonX, 30), WORLD_W-30);
                        summonY = Math.min(Math.max(summonY, 30), WORLD_H-30);
                        enemies.push(new Enemy(summonX, summonY, 'normal'));
                        this.summonCooldown = 4.0;
                        for(let i=0;i<10;i++) particles.push({ x: summonX, y: summonY, life:0.3, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, color:"#afa" });
                    }
                    if (this.summonCooldown !== null) this.summonCooldown -= delta;
                    if (this.attackTimer > 0) this.attackTimer -= delta;
                    if (this.hitFlash > 0) this.hitFlash -= delta;
                    if (this.hp <= 0 && this.explode && !this.hasExploded) {
                        // взрыв при смерти камикадзе
                        for(let i=0;i<15;i++) particles.push({ x: this.x+this.w/2, y: this.y+this.h/2, life:0.3, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, color:"#ff8800" });
                        this.hasExploded = true;
                    }
                }
                
                draw(cam) {
                    let x = this.x - cam.x, y = this.y - cam.y;
                    if(x + this.w < 0 || x > canvas.width || y + this.h < 0 || y > canvas.height) return;
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.beginPath(); ctx.ellipse(x+this.w/2+2, y+this.h-3, this.w/2+4,6,0,0,Math.PI*2); ctx.fill();
                    let drawColor = this.color;
                    if (this.hitFlash > 0) drawColor = "#fff";
                    if (this.burning > 0) drawColor = "#f84";
                    ctx.fillStyle = drawColor; ctx.fillRect(x, y, this.w, this.h);
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x+this.w*0.3, y+this.h*0.4, 4,0,Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x+this.w*0.7, y+this.h*0.4, 4,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x+this.w*0.3-1, y+this.h*0.4-1, 2,0,Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x+this.w*0.7-1, y+this.h*0.4-1, 2,0,Math.PI*2); ctx.fill();
                    let pct = this.hp / this.maxHp;
                    ctx.fillStyle = '#900'; ctx.fillRect(x, y-8, this.w, 5);
                    ctx.fillStyle = '#0a0'; ctx.fillRect(x, y-8, this.w * pct, 5);
                    ctx.font = 'bold 10px monospace'; ctx.fillStyle = '#fff';
                    ctx.fillText(this.name, x+5, y-10);
                }
                
                takeDamage(amount, knockbackDir, knockbackForce) {
                    this.hp -= amount;
                    this.hitFlash = 0.15;
                    if (knockbackDir && knockbackForce) {
                        let resist = 1 - this.knockbackResist;
                        let kb = knockbackForce * resist;
                        this.x += knockbackDir.x * kb;
                        this.y += knockbackDir.y * kb;
                        this.x = Math.min(Math.max(this.x,0), WORLD_W-this.w);
                        this.y = Math.min(Math.max(this.y,0), WORLD_H-this.h);
                    }
                    return this.hp <= 0;
                }
                
                setBurning(duration) { this.burning = duration; }
            }
            
            // --- ПАУЭР-АПЫ ---
            function addPowerup(type, duration) {
                const now = Date.now() / 1000;
                powerups = powerups.filter(p => p.endTime > now);
                powerups.push({ type, endTime: now + duration });
                if (type === 'attack_speed') {
                    // уже учтено в performAttack через глобальный флаг
                }
                if (type === 'invincible') {
                    // invincible: просто даём бафф, который блокирует урон
                }
                if (type === 'magnet') {
                    // магнит притягивает предметы в радиусе
                }
                updateBuffIndicator();
            }
            
            function isPowerupActive(type) {
                const now = Date.now() / 1000;
                for (let p of powerups) if (p.type === type && p.endTime > now) return true;
                return false;
            }
            
            function updateBuffIndicator() {
                const now = Date.now() / 1000;
                let active = [];
                for (let p of powerups) if (p.endTime > now) {
                    if (p.type === 'attack_speed') active.push(`⚡ атака x1.5`);
                    if (p.type === 'invincible') active.push(`✨ неуязвимость`);
                    if (p.type === 'magnet') active.push(`🧲 магнит`);
                }
                powerups = powerups.filter(p => p.endTime > now);
                if (active.length) document.getElementById('buffIndicator').innerHTML = '✨ ' + active.join(' | ');
                else document.getElementById('buffIndicator').innerHTML = '✨ Нет баффов';
                document.getElementById('speedBuff').innerText = player.speedBonus;
                document.getElementById('armorBuff').innerText = player.armorBonus;
            }
            
            // --- СИСТЕМА УРОВНЕЙ ---
            function addExperience(amount) {
                player.experience += amount;
                while (player.experience >= player.expToNext) {
                    player.experience -= player.expToNext;
                    player.level++;
                    player.expToNext = Math.floor(player.expToNext * 1.2);
                    showLevelUpPanel();
                }
                document.getElementById('level').innerText = player.level;
            }
            
            function showLevelUpPanel() {
                if (!gameActive) return;
                const panel = document.getElementById('levelUpPanel');
                panel.style.display = 'flex';
                // пауза игры
                gameActive = false;
            }
            
            document.getElementById('upgradeDamage').onclick = () => {
                player.damageBonus += 5;
                weapon.damage = weaponsLib[weaponIndex].baseDamage + player.damageBonus;
                document.getElementById('levelUpPanel').style.display = 'none';
                gameActive = true;
                updateWeaponDisplay();
            };
            document.getElementById('upgradeSpeed').onclick = () => {
                player.speedBonus = Math.min(player.speedBonus + 10, 60);
                document.getElementById('levelUpPanel').style.display = 'none';
                gameActive = true;
            };
            document.getElementById('upgradeHealth').onclick = () => {
                player.maxHp += 15;
                player.hp += 15;
                document.getElementById('levelUpPanel').style.display = 'none';
                gameActive = true;
            };
            document.getElementById('upgradeAttackSpeed').onclick = () => {
                player.attackSpeedBonus += 0.1; // уменьшение задержки на 10%
                document.getElementById('levelUpPanel').style.display = 'none';
                gameActive = true;
            };
            
            // --- ВОЛНЫ ---
            function updateWave(delta) {
                waveTimer += delta;
                document.getElementById('waveIndicator').innerHTML = `🌊 Волна ${wave} | ${Math.floor(waveDuration - waveTimer)}с`;
                if (waveTimer >= waveDuration) {
                    wave++;
                    waveTimer = 0;
                    waveBonusGiven = false;
                    // Бонус за прохождение волны: исцеление + пауэр-ап
                    player.hp = Math.min(player.maxHp, player.hp + 20);
                    addPowerup('attack_speed', 10);
                    for(let i=0;i<30;i++) particles.push({ x: player.x+PLAYER_W/2, y: player.y+PLAYER_H/2, life:0.5, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, color:"#ffdd88" });
                    // увеличиваем сложность спавна
                }
            }
            
            // --- ПРЕДМЕТЫ (добавлены пауэр-апы)---
            function spawnItem(x,y,type) { items.push({ x, y, w: 24, h: 24, type }); }
            
            function dropRandomItem(x,y) {
                let r = Math.random();
                if (r < 0.3) spawnItem(x,y,'medkit');
                else if (r < 0.5) spawnItem(x,y,'speedPotion');
                else if (r < 0.65) spawnItem(x,y,'armorPotion');
                else if (r < 0.8) spawnItem(x,y,'ragePotion');
                else if (r < 0.9) spawnItem(x,y,'powerup_attack');
                else spawnItem(x,y,'powerup_magnet');
            }
            
            function applyItemPickup(type) {
                if (type === 'medkit') player.hp = Math.min(player.maxHp, player.hp + 25);
                else if (type === 'speedPotion') applyBuff('speed');
                else if (type === 'armorPotion') applyBuff('armor');
                else if (type === 'ragePotion') applyBuff('rage');
                else if (type === 'powerup_attack') addPowerup('attack_speed', 12);
                else if (type === 'powerup_magnet') addPowerup('magnet', 10);
            }
            
            let buffs = [];
            function applyBuff(type) {
                const now = Date.now() / 1000;
                if (type === 'speed') {
                    player.speedBonus = Math.min(player.speedBonus + 20, 60);
                    buffs.push({ type: 'speed', endTime: now + 10, value: 20 });
                } else if (type === 'armor') {
                    player.armorBonus = Math.min(player.armorBonus + 10, 30);
                    buffs.push({ type: 'armor', endTime: now + 12, value: 10 });
                } else if (type === 'rage') {
                    buffs.push({ type: 'damage', endTime: now + 8, value: 1.5 });
                }
                updateBuffIndicator();
            }
            
            // --- СПАВН ВРАГОВ (зависит от волны)---
            function spawnRandomEnemy() {
                const types = ['normal', 'fast', 'tank', 'mage', 'berserk', 'summoner', 'exploder'];
                let weights = [35, 25, 15, 10, 8, 4, 3];
                // увеличение сложности с волной
                if (wave >= 3) weights[4] += 5; // больше берсерков
                if (wave >= 5) weights[6] += 5; // больше камикадзе
                let r = Math.random() * 100;
                let cum = 0, selected = 'normal';
                for (let i=0; i<types.length; i++) {
                    cum += weights[i];
                    if (r < cum) { selected = types[i]; break; }
                }
                let x = player.x + (Math.random()-0.5)*800;
                let y = player.y + (Math.random()-0.5)*800;
                x = Math.min(Math.max(x, 80), WORLD_W-80);
                y = Math.min(Math.max(y, 80), WORLD_H-80);
                if(Math.hypot(x-player.x, y-player.y) < 250) return;
                enemies.push(new Enemy(x,y,selected));
            }
            
            function scatterStartingItems(){
                for(let i=0;i<12;i++){
                    let x=150+Math.random()*(WORLD_W-300);
                    let y=150+Math.random()*(WORLD_H-300);
                    let ok=true;
                    for(let w of walls) if(x<w.x+w.w+30 && x+30>w.x && y<w.y+w.h+30 && y+30>w.y) ok=false;
                    if(ok) dropRandomItem(x,y);
                }
            }
            
            // --- СТЕНЫ ---
            function addWall(x,y,w,h){ walls.push({x,y,w,h}); }
            const wallData = [[200,300,70,70],[450,500,60,60],[700,200,80,80],[1000,600,75,75],[1300,350,70,70],[1600,700,90,55],[1900,400,80,80],[2200,800,85,85],[2500,300,70,70],[300,1300,200,40],[600,1400,40,180],[900,1350,140,40],[1200,1650,55,190],[1500,1500,180,45],[1800,1800,50,140],[2100,1450,80,80],[2300,1950,120,50],[100,2000,80,80],[300,2150,70,100],[80,700,90,70],[60,1100,80,80],[2700,2050,100,90],[2600,2250,110,60],[2850,700,90,90],[2750,400,120,55],[2800,1400,75,130],[1500,1150,100,100],[1380,1050,55,135],[1620,1080,55,125],[900,2050,45,45],[1150,2120,50,50],[1950,2100,55,55],[2250,650,50,50],[2450,1900,60,60]];
            wallData.forEach(w => addWall(w[0],w[1],w[2],w[3]));
            for(let i=0;i<180;i++) decor.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H });
            
            // --- УПРАВЛЕНИЕ NIPPLEJS ---
            if (typeof nipplejs !== 'undefined') {
                nipplejs.create({ zone: document.getElementById('moveArea'), mode: 'static', size: 120, color: '#d4c29b', restOpacity: 0.7, shape: 'circle' })
                    .on('move', (evt, nipple) => { const v = nipple.vector; moveVec.x = v.x; moveVec.y = -v.y; })
                    .on('end', () => { moveVec = {x:0, y:0}; });
                nipplejs.create({ zone: document.getElementById('attackArea'), mode: 'static', size: 110, color: '#ff8844', restOpacity: 0.7, shape: 'circle' })
                    .on('move', (evt, nipple) => { const v = nipple.vector; let dx=v.x, dy=-v.y; let len=Math.hypot(dx,dy); if(len>0.01){ dx/=len; dy/=len; } else { dx=1; dy=0; } performAttack({x:dx, y:dy}); });
            }
            document.getElementById('attackArea').addEventListener('click', (e) => {
                let dx = e.clientX - (player.x - camera.x + PLAYER_W/2);
                let dy = e.clientY - (player.y - camera.y + PLAYER_H/2);
                let len = Math.hypot(dx, dy);
                if (len>0.01) { dx/=len; dy/=len; } else { dx=1; dy=0; }
                if(weapon.cd<=0) performAttack({x:dx, y:dy});
            });
            
            function updateWeaponDisplay() {
                document.getElementById('weaponInfo').innerHTML = `${weapon.emoji} ${weapon.name} (${weapon.damage})`;
            }
            
            // --- АТАКА (с учётом пауэр-апов)---
            function performAttack(dir) {
                if (weapon.cd > 0) return;
                let damageMulti = 1;
                const now = Date.now() / 1000;
                for (let b of buffs) if (b.type === 'damage' && b.endTime > now) damageMulti = b.value;
                let attackSpeedMulti = 1;
                if (isPowerupActive('attack_speed')) attackSpeedMulti = 0.66;
                let finalDelay = weapon.delay * (1 - player.attackSpeedBonus*0.1) * attackSpeedMulti;
                if (finalDelay < 0.2) finalDelay = 0.2;
                let isCrit = Math.random() < 0.2;
                let finalDamage = Math.floor((weapon.damage + player.damageBonus) * damageMulti * (isCrit ? 2 : 1));
                
                // Анимация взмаха
                meleeSwing.active = true;
                meleeSwing.timer = meleeSwing.duration;
                meleeSwing.angle = Math.atan2(dir.y, dir.x);
                meleeSwing.x = player.x + PLAYER_W/2;
                meleeSwing.y = player.y + PLAYER_H/2;
                for(let i=0;i<12;i++) particles.push({ 
                    x: meleeSwing.x, y: meleeSwing.y, life:0.25, 
                    vx: Math.cos(meleeSwing.angle + (Math.random()-0.5)*1.5)*5, 
                    vy: Math.sin(meleeSwing.angle + (Math.random()-0.5)*1.5)*5, 
                    color: isCrit ? "#ffcc00" : "#ffcc88" 
                });
                
                if (weapon.type === 0 || weapon.type === 3) { // Melee
                    let ax = player.x + PLAYER_W/2, ay = player.y + PLAYER_H/2;
                    for (let i = 0; i < enemies.length; i++) {
                        let e = enemies[i];
                        let ex = e.x + e.w/2, ey = e.y + e.h/2;
                        if (Math.hypot(ax - ex, ay - ey) < weapon.range) {
                            let kbDir = { x: ex-ax, y: ey-ay };
                            let kblen = Math.hypot(kbDir.x, kbDir.y);
                            if(kblen>0.01){ kbDir.x/=kblen; kbDir.y/=kblen; }
                            let dead = e.takeDamage(finalDamage, kbDir, weapon.knockback);
                            if (dead) {
                                enemies.splice(i,1);
                                player.kills++;
                                document.getElementById('kills').innerText = player.kills;
                                addExperience(e.exp);
                                updateCombo();
                                if (Math.random() < 0.35) dropRandomItem(ex, ey);
                                for(let p=0;p<20;p++) particles.push({ x: ex, y: ey, life:0.4, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, color: isCrit ? "#ffaa44" : "#ff8844" });
                                i--;
                            } else {
                                for(let p=0;p<8;p++) particles.push({ x: ex, y: ey, life:0.2, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, color:"#f88" });
                            }
                        }
                    }
                } else { // Ranged
                    let projEffect = weapon.projectileEffect;
                    projectiles.push({
                        x: player.x+PLAYER_W/2, y: player.y+PLAYER_H/2,
                        vx: dir.x * weapon.projSpeed, vy: dir.y * weapon.projSpeed,
                        damage: finalDamage, traveled: 0, range: weapon.range,
                        size: 8, color: weapon.color, crit: isCrit, effect: projEffect
                    });
                }
                weapon.cd = finalDelay;
                if (window.comboBonusActive) weapon.cd *= 0.8;
            }
            
            // --- КОМБО ---
            let combo = 0, comboTime = 0, lastKillTime = 0;
            function updateCombo() {
                const now = Date.now() / 1000;
                if (now - lastKillTime < 3) combo++;
                else combo = 1;
                lastKillTime = now;
                comboTime = now + 3;
                document.getElementById('comboCounter').innerHTML = `🔥 ${combo} комбо`;
                if (combo >= 10 && !window.comboBonusActive) {
                    window.comboBonusActive = true;
                    setTimeout(() => { window.comboBonusActive = false; }, 5000);
                }
            }
            function resetCombo() {
                if (Date.now()/1000 > comboTime) {
                    combo = 0;
                    document.getElementById('comboCounter').innerHTML = `🔥 0 комбо`;
                }
            }
            
            // --- ПОДБОР ПРЕДМЕТОВ С МАГНИТОМ ---
            function checkPickup() {
                let magnetRange = isPowerupActive('magnet') ? 200 : 30;
                for (let i=0; i<items.length; i++) {
                    let it = items[i];
                    let dist = Math.hypot(player.x+PLAYER_W/2 - (it.x+it.w/2), player.y+PLAYER_H/2 - (it.y+it.h/2));
                    if (dist < magnetRange) {
                        if (dist < 28) {
                            applyItemPickup(it.type);
                            items.splice(i,1);
                            for(let p=0;p<15;p++) particles.push({ x:it.x+it.w/2, y:it.y+it.h/2, life:0.3, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3, color:"#ffd700" });
                            i--;
                        } else if (isPowerupActive('magnet')) {
                            // подтягиваем предмет к игроку
                            let angle = Math.atan2(player.y+PLAYER_H/2 - (it.y+it.h/2), player.x+PLAYER_W/2 - (it.x+it.w/2));
                            let speed = 8;
                            it.x += Math.cos(angle) * speed;
                            it.y += Math.sin(angle) * speed;
                        }
                    }
                }
            }
            
            // --- ДВИЖЕНИЕ И СТОЛКНОВЕНИЯ ---
            let keyState = { w:false,s:false,a:false,d:false,ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false };
            window.addEventListener('keydown', (e)=>{ if(keyState.hasOwnProperty(e.key)) { keyState[e.key]=true; e.preventDefault(); } if(e.key===' '||e.key==='Space') { e.preventDefault(); if(weapon.cd<=0) performAttack({x:player.dirX||1, y:player.dirY||0}); } });
            window.addEventListener('keyup', (e)=>{ if(keyState.hasOwnProperty(e.key)) keyState[e.key]=false; });
            
            function collision(x,y,w,h){
                if(x<0 || y<0 || x+w>WORLD_W || y+h>WORLD_H) return true;
                for(let wa of walls) if(x<wa.x+wa.w && x+w>wa.x && y<wa.y+wa.h && y+h>wa.y) return true;
                return false;
            }
            
            function movePlayer() {
                let mx = 0, my = 0;
                if (keyState.w || keyState.ArrowUp) my -= 1;
                if (keyState.s || keyState.ArrowDown) my += 1;
                if (keyState.a || keyState.ArrowLeft) mx -= 1;
                if (keyState.d || keyState.ArrowRight) mx += 1;
                if (moveVec.x !== 0 || moveVec.y !== 0) { mx += moveVec.x; my += moveVec.y; }
                let len = Math.hypot(mx, my);
                if (len > 0) { mx /= len; my /= len; }
                if (mx !== 0 || my !== 0) { player.dirX = mx; player.dirY = my; player.anim += 0.2; } else player.anim = 0;
                let currentSpeed = BASE_SPEED * (1 + player.speedBonus/100);
                let newX = player.x + mx * currentSpeed;
                let newY = player.y + my * currentSpeed;
                if (!collision(newX, player.y, PLAYER_W, PLAYER_H)) player.x = newX;
                if (!collision(player.x, newY, PLAYER_W, PLAYER_H)) player.y = newY;
                for(let e of enemies){
                    let overlapX = (player.x+PLAYER_W/2)-(e.x+e.w/2), overlapY = (player.y+PLAYER_H/2)-(e.y+e.h/2);
                    let dist = Math.hypot(overlapX, overlapY);
                    let minDist = (PLAYER_W/2 + e.w/2);
                    if(dist < minDist){
                        let angle = Math.atan2(overlapY, overlapX);
                        let push = (minDist - dist) * 0.9;
                        player.x += Math.cos(angle)*push; player.y += Math.sin(angle)*push;
                        e.x -= Math.cos(angle)*push*0.6; e.y -= Math.sin(angle)*push*0.6;
                        player.x = Math.min(Math.max(player.x,0), WORLD_W-PLAYER_W);
                        player.y = Math.min(Math.max(player.y,0), WORLD_H-PLAYER_H);
                        e.x = Math.min(Math.max(e.x,0), WORLD_W-e.w);
                        e.y = Math.min(Math.max(e.y,0), WORLD_H-e.h);
                    }
                }
            }
            
            // --- СНАРЯДЫ С ЭФФЕКТАМИ ---
            function updateProjectiles(delta) {
                for (let i=0;i<projectiles.length;i++) {
                    let p = projectiles[i];
                    p.x += p.vx; p.y += p.vy;
                    p.traveled += Math.hypot(p.vx, p.vy);
                    let hit = false;
                    for(let w of walls) if(p.x>w.x && p.x<w.x+w.w && p.y>w.y && p.y<w.y+w.h) { hit=true; break; }
                    if(p.traveled > p.range || hit || p.x<0 || p.x>WORLD_W || p.y<0 || p.y>WORLD_H) { projectiles.splice(i,1); i--; continue; }
                    for(let j=0;j<enemies.length;j++) {
                        let e=enemies[j];
                        if(p.x>e.x && p.x<e.x+e.w && p.y>e.y && p.y<e.y+e.h){
                            let dead = e.takeDamage(p.damage, null, 0);
                            if (p.effect === 'fire') e.setBurning(3);
                            projectiles.splice(i,1);
                            for(let pt=0;pt<8;pt++) particles.push({ x:p.x, y:p.y, life:0.2, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3, color:p.crit ? "#ffdd44" : "#ffa" });
                            if(dead) { enemies.splice(j,1); player.kills++; document.getElementById('kills').innerText=player.kills; addExperience(e.exp); updateCombo(); if(Math.random()<0.35) dropRandomItem(e.x+e.w/2, e.y+e.h/2); j--; }
                            break;
                        }
                    }
                }
                for (let i=0;i<enemyProjectiles.length;i++) {
                    let p = enemyProjectiles[i];
                    p.x += p.vx; p.y += p.vy;
                    if (p.x<0 || p.x>WORLD_W || p.y<0 || p.y>WORLD_H) { enemyProjectiles.splice(i,1); i--; continue; }
                    if (Math.hypot(p.x - (player.x+PLAYER_W/2), p.y - (player.y+PLAYER_H/2)) < 25) {
                        if (!isPowerupActive('invincible')) {
                            let finalDamage = p.damage - player.armorBonus;
                            if (finalDamage < 2) finalDamage = 2;
                            player.hp -= finalDamage;
                        }
                        player.invTimer = 0.5;
                        enemyProjectiles.splice(i,1);
                        for(let pt=0;pt<8;pt++) particles.push({ x:p.x, y:p.y, life:0.2, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3, color:"#f44" });
                        i--;
                    }
                }
            }
            
            // --- ОБНОВЛЕНИЯ ---
            function updateCooldowns(delta) {
                let maxDelay = weapon.delay * (1 - player.attackSpeedBonus*0.1);
                if (isPowerupActive('attack_speed')) maxDelay *= 0.66;
                if (weapon.cd > 0) { weapon.cd -= delta; let fill = 1 - weapon.cd/maxDelay; document.getElementById('reloadFill').style.width = (fill*100)+'%'; }
                else document.getElementById('reloadFill').style.width = '100%';
                if (meleeSwing.active) { meleeSwing.timer -= delta; if(meleeSwing.timer<=0) meleeSwing.active=false; }
                if (player.invTimer > 0) player.invTimer -= delta;
                if (player.hp > player.maxHp) player.hp = player.maxHp;
                document.getElementById('hp').innerText = Math.floor(player.hp);
                updateBuffIndicator();
                resetCombo();
                for(let i=0;i<particles.length;i++){
                    particles[i].life -= delta;
                    if(particles[i].life<=0){ particles.splice(i,1); i--; continue; }
                    particles[i].x += particles[i].vx; particles[i].y += particles[i].vy;
                }
            }
            
            function updateSpawning(delta) {
                spawnTimer += delta;
                let maxEnemies = 10 + Math.floor(wave/2);
                if (spawnTimer > (wave > 5 ? 2.5 : 3.5) && enemies.length < maxEnemies) {
                    spawnTimer = 0;
                    spawnRandomEnemy();
                    if (enemies.length < maxEnemies-3 && Math.random()<0.4) spawnRandomEnemy();
                }
            }
            
            function updateCamera() {
                let tx = player.x + PLAYER_W/2 - canvas.width/2;
                let ty = player.y + PLAYER_H/2 - canvas.height/2;
                camera.x = Math.min(Math.max(0, tx), WORLD_W - canvas.width);
                camera.y = Math.min(Math.max(0, ty), WORLD_H - canvas.height);
            }
            
            // --- МИНИ-КАРТА ---
            function drawMinimap() {
                const mapSize = 120;
                const mapX = canvas.width - mapSize - 10;
                const mapY = 10;
                ctx.globalAlpha = 0.7;
                ctx.fillStyle = "#000000aa";
                ctx.fillRect(mapX, mapY, mapSize, mapSize);
                ctx.strokeStyle = "#fff";
                ctx.strokeRect(mapX, mapY, mapSize, mapSize);
                // масштаб
                let scaleX = mapSize / WORLD_W;
                let scaleY = mapSize / WORLD_H;
                // игрок
                ctx.fillStyle = "#0f0";
                ctx.beginPath();
                ctx.arc(mapX + player.x * scaleX, mapY + player.y * scaleY, 3, 0, Math.PI*2);
                ctx.fill();
                // враги
                for (let e of enemies) {
                    ctx.fillStyle = "#f00";
                    ctx.beginPath();
                    ctx.arc(mapX + e.x * scaleX, mapY + e.y * scaleY, 2, 0, Math.PI*2);
                    ctx.fill();
                }
                // предметы
                for (let it of items) {
                    ctx.fillStyle = "#ff0";
                    ctx.beginPath();
                    ctx.arc(mapX + it.x * scaleX, mapY + it.y * scaleY, 2, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
            
            // --- ОТРИСОВКА МИРА ---
            function drawGround() {
                let grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
                grad.addColorStop(0, '#5d9652'); grad.addColorStop(1, '#2b522c');
                ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);
                for(let i=0;i<600;i++) {
                    let wx = (i*311)%WORLD_W, wy = (i*457)%WORLD_H, sx = wx-camera.x, sy = wy-camera.y;
                    if(sx>0 && sx<canvas.width && sy>0 && sy<canvas.height){ ctx.fillStyle = 'rgba(210,240,120,0.25)'; ctx.beginPath(); ctx.arc(sx,sy,1.5,0,Math.PI*2); ctx.fill(); }
                }
            }
            function drawWalls() { for(let w of walls){ let x=w.x-camera.x, y=w.y-camera.y; if(x+w.w<0||x>canvas.width||y+w.h<0||y>canvas.height) continue; ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(x+w.w/2+2,y+w.h-3,w.w/2+4,8,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#5f5035'; ctx.fillRect(x,y+22,w.w,w.h); ctx.fillStyle='#b39d6b'; ctx.beginPath(); ctx.moveTo(x,y+22); ctx.lineTo(x+w.w,y+22); ctx.lineTo(x+w.w-5,y); ctx.lineTo(x+5,y); ctx.fill(); ctx.fillStyle='#473d28'; ctx.fillRect(x+w.w-6,y+20,6,w.h); } }
            function drawDecor() { for(let d of decor){ let x=d.x-camera.x, y=d.y-camera.y; if(x>-50&&x<canvas.width+50&&y>-50&&y<canvas.height+50) { ctx.fillStyle='#4c7a3a'; ctx.beginPath(); ctx.ellipse(x,y-4,10,7,0,0,Math.PI*2); ctx.fill(); } } }
            function drawItems() {
                for(let it of items){
                    let x=it.x-camera.x, y=it.y-camera.y;
                    if(x<-30||x>canvas.width+30) continue;
                    ctx.fillStyle = '#ffcc77'; ctx.fillRect(x,y,it.w,it.h);
                    ctx.fillStyle = '#aa8844'; ctx.fillRect(x+4,y+4,it.w-8,it.h-8);
                    ctx.fillStyle = '#fff'; ctx.font='bold 14px monospace';
                    let icon = '';
                    if (it.type === 'medkit') icon = '❤️';
                    else if (it.type === 'speedPotion') icon = '⚡';
                    else if (it.type === 'armorPotion') icon = '🛡️';
                    else if (it.type === 'ragePotion') icon = '💢';
                    else if (it.type === 'powerup_attack') icon = '⚔️';
                    else if (it.type === 'powerup_magnet') icon = '🧲';
                    ctx.fillText(icon, x+5, y+18);
                    ctx.globalAlpha = 0.5 + Math.sin(Date.now()/200)*0.3;
                    ctx.fillStyle = '#ffdd99'; ctx.fillRect(x+2, y+2, 6, 6);
                    ctx.globalAlpha = 1;
                }
            }
            function drawPlayer() {
                let px=player.x-camera.x, py=player.y-camera.y, cx=px+PLAYER_W/2, cy=py+PLAYER_H/2;
                ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(cx+3,cy+6,20,10,0,0,Math.PI*2); ctx.fill();
                let step=Math.sin(player.anim*Math.PI)*2;
                ctx.fillStyle='#628e84'; ctx.beginPath(); ctx.ellipse(cx, cy+3+step*0.2, 17,19,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#c9894b'; ctx.fillRect(cx-11, cy+5+step*0.1,22,5);
                ctx.fillStyle='#4f786c'; ctx.beginPath(); ctx.ellipse(cx, cy-8+step*0.1,14,15,0,0,Math.PI*2); ctx.fill();
                let eyeX=(player.dirX!==0)?player.dirX*2:0, eyeY=(player.dirY!==0)?player.dirY*1.6:1;
                ctx.fillStyle='#faf4e0'; ctx.beginPath(); ctx.ellipse(cx-7+eyeX*0.4, cy-11+eyeY*0.6+step*0.05,3.8,4.5,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(cx+5+eyeX*0.4, cy-11+eyeY*0.6+step*0.05,3.8,4.5,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#1f2f28'; ctx.beginPath(); ctx.ellipse(cx-7+eyeX, cy-10+eyeY*0.8+step*0.05,2,2.5,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(cx+5+eyeX, cy-10+eyeY*0.8+step*0.05,2,2.5,0,0,Math.PI*2); ctx.fill();
                if(meleeSwing.active){ let ang=meleeSwing.angle, ax=meleeSwing.x-camera.x, ay=meleeSwing.y-camera.y; ctx.beginPath(); ctx.arc(ax, ay, 38, ang-1.0, ang+1.0); ctx.strokeStyle='#ffdd88'; ctx.lineWidth=8; ctx.stroke(); ctx.beginPath(); ctx.arc(ax, ay, 38, ang-1.0, ang+1.0); ctx.strokeStyle='#ffaa33'; ctx.lineWidth=4; ctx.stroke(); }
                if(player.invTimer>0 && (Math.floor(Date.now()/50)%2===0)) ctx.globalAlpha=0.5;
            }
            function drawProjectiles() { for(let p of projectiles){ let sx=p.x-camera.x, sy=p.y-camera.y; ctx.fillStyle=p.crit ? "#ffdd66" : p.color; ctx.beginPath(); ctx.arc(sx,sy,p.size,0,Math.PI*2); ctx.fill(); if(p.crit) { ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(sx,sy,p.size-2,0,Math.PI*2); ctx.fill(); } } }
            function drawEnemyProjectiles() { for(let p of enemyProjectiles){ let sx=p.x-camera.x, sy=p.y-camera.y; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,sy,6,0,Math.PI*2); ctx.fill(); } }
            function drawParticles(){ for(let p of particles){ let sx=p.x-camera.x, sy=p.y-camera.y; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,sy,3,0,Math.PI*2); ctx.fill(); } }
            function drawLighting() {
                let cx = player.x + PLAYER_W/2 - camera.x;
                let cy = player.y + PLAYER_H/2 - camera.y;
                let grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 150);
                grad.addColorStop(0, 'rgba(255,240,180,0.2)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'source-over';
            }
            
            function showDeath() {
                if(!gameActive) return;
                gameActive = false;
                let div = document.createElement('div'); div.className = 'death-screen';
                div.innerHTML = '<div class="death-window"><h2>💀 ВЫ ПОВЕРЖЕНЫ 💀</h2><button id="restart">Возродиться</button></div>';
                document.body.appendChild(div); document.getElementById('restart').onclick = () => location.reload();
            }
            
            // --- ОСНОВНОЙ ЦИКЛ ---
            function gameLoop(now) {
                if (!gameActive) { requestAnimationFrame(gameLoop); return; }
                let delta = Math.min(0.033, (now - lastTimestamp) / 1000);
                if (delta > 0) {
                    updateCooldowns(delta);
                    updateProjectiles(delta);
                    for(let e of enemies) e.update(delta);
                    movePlayer();
                    checkPickup();
                    updateSpawning(delta);
                    updateWave(delta);
                    if (player.hp <= 0) showDeath();
                }
                lastTimestamp = now;
                updateCamera();
                drawGround(); drawWalls(); drawDecor(); drawItems();
                for(let e of enemies) e.draw(camera);
                drawEnemyProjectiles();
                drawProjectiles();
                drawPlayer();
                drawParticles();
                drawLighting();
                drawMinimap();
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#c0e0a020'; ctx.fillRect(0,0,canvas.width,canvas.height);
                requestAnimationFrame(gameLoop);
            }
            
            // --- ИНИЦИАЛИЗАЦИЯ ---
            function init() {
                scatterStartingItems();
                for(let i=0;i<6;i++) spawnRandomEnemy();
                waveTimer = 0;
                wave = 1;
                document.getElementById('waveIndicator').innerHTML = `🌊 Волна 1`;
                updateWeaponDisplay();
            }
            
            init();
            lastTimestamp = performance.now();
            gameLoop(lastTimestamp);
        })();
    </script>
</body>
</html>
