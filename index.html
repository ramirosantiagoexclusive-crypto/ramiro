<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2.5D Приключение - Свой спрайт персонажа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a2a22;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', monospace;
            padding: 10px;
            touch-action: none; /* отключаем жесты браузера */
        }

        .game-container {
            background: #1e3b32;
            border-radius: 1.5rem;
            padding: 0.8rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 1rem;
            box-shadow: 0 0 0 3px #c9a87b, 0 8px 20px black;
            width: 100%;
            height: auto;
            cursor: crosshair;
            touch-action: none;
        }

        .info-panel {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #0f2c26cc;
            backdrop-filter: blur(4px);
            padding: 8px 15px;
            border-radius: 40px;
            color: #f9e2b7;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 8px;
            background: #1e2f28;
            padding: 5px 12px;
            border-radius: 40px;
        }

        .controls span {
            background: #2b4a3e;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.8rem;
        }

        .upload-area {
            background: #00000066;
            padding: 4px 12px;
            border-radius: 32px;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 0.8rem;
        }

        .upload-area input {
            background: #d4c29b;
            border: none;
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 0.7rem;
        }

        /* сенсорные кнопки */
        .touch-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }
        .touch-btn {
            background: #1e2f28dd;
            backdrop-filter: blur(8px);
            border: none;
            color: #ffefc0;
            font-size: 2rem;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
            touch-action: manipulation;
            box-shadow: 0 4px 0 #0a1915;
            transition: 0.05s linear;
            cursor: pointer;
        }
        .touch-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0a1915;
        }
        @media (max-width: 700px) {
            .touch-btn { font-size: 1.8rem; padding: 6px 18px; }
            .controls span { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div class="info-panel">
            <div class="controls">
                <span>⌨️ WASD / стрелки</span>
                <span>📱 сенсорные кнопки</span>
            </div>
            <div class="upload-area">
                🎨 Свой спрайт: 
                <input type="file" id="spriteUpload" accept="image/png, image/jpeg, image/webp">
            </div>
        </div>
        <div class="touch-panel" id="touchControls">
            <button class="touch-btn" data-dir="up">▲</button>
            <button class="touch-btn" data-dir="left">◀</button>
            <button class="touch-btn" data-dir="down">▼</button>
            <button class="touch-btn" data-dir="right">▶</button>
        </div>
        <div style="font-size:11px; text-align:center; margin-top:6px; color:#bcdaa7;">
            💡 Загрузите спрайт-лист 4x4 (16 кадров, 64x64 или 128x128). Пример файла прилагается.
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- НАСТРОЙКИ МИРА ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Адаптивный размер canvas (сохраняем игровое поле, но камера подстраивается)
        let CANVAS_W = 900;
        let CANVAS_H = 600;
        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxWidth = Math.min(window.innerWidth - 40, 1100);
            const maxHeight = window.innerHeight * 0.65;
            let ratio = CANVAS_W / CANVAS_H;
            let newWidth = maxWidth;
            let newHeight = newWidth / ratio;
            if (newHeight > maxHeight) {
                newHeight = maxHeight;
                newWidth = newHeight * ratio;
            }
            canvas.style.width = `${newWidth}px`;
            canvas.style.height = `${newHeight}px`;
            canvas.width = CANVAS_W;
            canvas.height = CANVAS_H;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        const WORLD_WIDTH = 2800;
        const WORLD_HEIGHT = 2200;
        const PLAYER_W = 38;
        const PLAYER_H = 38;
        const MOVE_SPEED = 5.2;
        
        let player = {
            x: WORLD_WIDTH / 2,
            y: WORLD_HEIGHT / 2,
            dirX: 0,
            dirY: 1,
            frame: 0,
            animTime: 0
        };
        
        // ----- СТЕНЫ (без изменений) -----
        let walls = [];
        function addWall(x,y,w,h){ walls.push({x,y,w,h}); }
        function initWalls() {
            addWall(180, 340, 70, 70); addWall(380, 530, 60, 60); addWall(620, 210, 85, 85);
            addWall(890, 670, 75, 75); addWall(1170, 320, 65, 65); addWall(1450, 760, 90, 55);
            addWall(1720, 400, 70, 70); addWall(2010, 840, 80, 80); addWall(2320, 280, 65, 100);
            addWall(2640, 510, 95, 65); addWall(340, 1280, 210, 40); addWall(590, 1390, 40, 180);
            addWall(860, 1320, 150, 40); addWall(1120, 1600, 55, 190); addWall(1410, 1440, 190, 45);
            addWall(1680, 1700, 50, 140); addWall(1920, 1400, 80, 80); addWall(2150, 1850, 130, 50);
            addWall(110, 1980, 85, 85); addWall(290, 2130, 70, 110); addWall(90, 620, 95, 70);
            addWall(50, 1020, 80, 80); addWall(2750, 2000, 105, 95); addWall(2500, 2180, 110, 60);
            addWall(2820, 650, 90, 90); addWall(2690, 380, 120, 55); addWall(2790, 1320, 75, 130);
            addWall(1460, 1080, 100, 100); addWall(1340, 990, 55, 135); addWall(1570, 1020, 55, 125);
            addWall(830, 1980, 45, 45); addWall(1100, 2060, 50, 50); addWall(1890, 2020, 55, 55);
            addWall(2180, 590, 50, 50); addWall(2380, 1810, 60, 60);
        }
        initWalls();
        
        // декорации (кусты, камни)
        let decorations = [];
        for(let i=0;i<180;i++) decorations.push({ x: Math.random()*WORLD_WIDTH, y: Math.random()*WORLD_HEIGHT, type: Math.floor(Math.random()*3) });
        
        // ----- УПРАВЛЕНИЕ (клавиатура + тач) -----
        const keys = { ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false, w:false, s:false, a:false, d:false };
        window.addEventListener('keydown', (e) => {
            let k = e.key;
            if(keys.hasOwnProperty(k)) { keys[k]=true; e.preventDefault(); }
            if(k==='w'||k==='W') keys.w=true;
            if(k==='s'||k==='S') keys.s=true;
            if(k==='a'||k==='A') keys.a=true;
            if(k==='d'||k==='D') keys.d=true;
        });
        window.addEventListener('keyup', (e) => {
            let k = e.key;
            if(keys.hasOwnProperty(k)) keys[k]=false;
            if(k==='w'||k==='W') keys.w=false;
            if(k==='s'||k==='S') keys.s=false;
            if(k==='a'||k==='A') keys.a=false;
            if(k==='d'||k==='D') keys.d=false;
        });
        
        // сенсорные кнопки
        const touchBtns = document.querySelectorAll('.touch-btn');
        let touchDir = { up:false, down:false, left:false, right:false };
        touchBtns.forEach(btn => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); let d = btn.dataset.dir; if(d) touchDir[d]=true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); let d = btn.dataset.dir; if(d) touchDir[d]=false; });
            btn.addEventListener('mousedown', () => { let d = btn.dataset.dir; if(d) touchDir[d]=true; });
            btn.addEventListener('mouseup', () => { let d = btn.dataset.dir; if(d) touchDir[d]=false; });
        });
        
        // ----- КОЛЛИЗИИ -----
        function collision(newX, newY, w, h){
            if(newX<0 || newY<0 || newX+w>WORLD_WIDTH || newY+h>WORLD_HEIGHT) return true;
            for(let wall of walls)
                if(newX<wall.x+wall.w && newX+w>wall.x && newY<wall.y+wall.h && newY+h>wall.y) return true;
            return false;
        }
        
        function updateMovement() {
            let moveX=0, moveY=0;
            if(keys.ArrowUp||keys.w||touchDir.up) moveY-=1;
            if(keys.ArrowDown||keys.s||touchDir.down) moveY+=1;
            if(keys.ArrowLeft||keys.a||touchDir.left) moveX-=1;
            if(keys.ArrowRight||keys.d||touchDir.right) moveX+=1;
            if(moveX!==0 || moveY!==0) { player.dirX=moveX; player.dirY=moveY; }
            let len=Math.hypot(moveX,moveY);
            if(len>0){ moveX/=len; moveY/=len; }
            let deltaX=moveX*MOVE_SPEED, deltaY=moveY*MOVE_SPEED;
            let newX=player.x+deltaX;
            if(!collision(newX,player.y,PLAYER_W,PLAYER_H)) player.x=newX;
            else {
                let stepX=Math.sign(deltaX)*1.6;
                for(let i=0;i<2;i++) { let tx=player.x+stepX; if(!collision(tx,player.y,PLAYER_W,PLAYER_H)){ player.x=tx; break; } stepX*=0.6; }
            }
            let newY=player.y+deltaY;
            if(!collision(player.x,newY,PLAYER_W,PLAYER_H)) player.y=newY;
            else {
                let stepY=Math.sign(deltaY)*1.6;
                for(let i=0;i<2;i++) { let ty=player.y+stepY; if(!collision(player.x,ty,PLAYER_W,PLAYER_H)){ player.y=ty; break; } stepY*=0.6; }
            }
            // анимация
            if(moveX!==0 || moveY!==0) player.animTime+=0.2;
            else player.animTime=0;
        }
        
        // ----- КАМЕРА -----
        let camera = {x:0,y:0};
        function updateCamera(){
            let tx = player.x+PLAYER_W/2 - CANVAS_W/2;
            let ty = player.y+PLAYER_H/2 - CANVAS_H/2;
            camera.x = Math.min(Math.max(0,tx), WORLD_WIDTH-CANVAS_W);
            camera.y = Math.min(Math.max(0,ty), WORLD_HEIGHT-CANVAS_H);
        }
        
        // ========== 1. ПОЛ (только травяной градиент + декор, НИКАКОЙ ДВИЖУЩЕЙСЯ СЕТКИ) ==========
        function drawGround() {
            const grad = ctx.createLinearGradient(0, CANVAS_H, 0, 0);
            grad.addColorStop(0, '#5d9652');
            grad.addColorStop(1, '#2b522c');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
            // мелкие точечки-травинки по миру
            for(let i=0;i<500;i++) {
                let worldX = (i*311)%WORLD_WIDTH;
                let worldY = (i*457)%WORLD_HEIGHT;
                let sx = worldX - camera.x;
                let sy = worldY - camera.y;
                if(sx>0 && sx<CANVAS_W && sy>0 && sy<CANVAS_H){
                    ctx.fillStyle = `rgba(210, 240, 120, 0.3)`;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 1.4, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }
        
        // стены (объёмные)
        function drawWall(wall){
            let x = wall.x - camera.x, y = wall.y - camera.y, w = wall.w, h = wall.h;
            if(x+w<0 || x>CANVAS_W || y+h<0 || y>CANVAS_H) return;
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(x+w/2+2, y+h-3, w/2+4, 8,0,0,Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#5f5035';
            ctx.fillRect(x, y+22, w, h);
            ctx.fillStyle = '#897a51';
            for(let i=0;i<6;i++){ ctx.fillRect(x+i*12, y+28, 6,4); ctx.fillRect(x+i*15+4, y+40, 7,4); }
            ctx.fillStyle = '#b39d6b';
            ctx.beginPath();
            ctx.moveTo(x, y+22); ctx.lineTo(x+w, y+22); ctx.lineTo(x+w-5, y); ctx.lineTo(x+5, y);
            ctx.fill();
            ctx.fillStyle = '#ddbc82';
            ctx.beginPath();
            ctx.moveTo(x+7, y+5); ctx.lineTo(x+w-10, y+5); ctx.lineTo(x+w-8, y+20); ctx.lineTo(x+7, y+20);
            ctx.fill();
            ctx.fillStyle = '#473d28';
            ctx.fillRect(x+w-6, y+20, 6, h);
        }
        
        function drawDecor(dec){
            let x = dec.x - camera.x, y = dec.y - camera.y;
            if(x<-40 || x>CANVAS_W+40 || y<-40 || y>CANVAS_H+40) return;
            ctx.shadowBlur=3; ctx.shadowOffsetX=2; ctx.shadowOffsetY=2;
            if(dec.type===0){ // куст
                ctx.fillStyle='#4c7a3a'; ctx.beginPath(); ctx.ellipse(x,y-4,12,8,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#6fa34f'; ctx.beginPath(); ctx.ellipse(x-3,y-9,8,7,0,0,Math.PI*2); ctx.fill();
            } else if(dec.type===1){ // камень
                ctx.fillStyle='#6c6652'; ctx.beginPath(); ctx.ellipse(x,y,9,5,0,0,Math.PI*2); ctx.fill();
            } else { // пень
                ctx.fillStyle='#7a5a3a'; ctx.fillRect(x-7,y-6,14,10);
                ctx.fillStyle='#b88d55'; ctx.beginPath(); ctx.ellipse(x,y-6,7,4,0,0,Math.PI*2); ctx.fill();
            }
            ctx.shadowBlur=0;
        }
        
        // ========== РАБОТА СО СПРАЙТАМИ ПЕРСОНАЖА ==========
        let playerSprite = null;      // загруженное изображение
        let spriteReady = false;
        let spriteConfig = { cols:4, rows:4, frameW:32, frameH:32 }; // базовые размеры, будут пересчитаны
        
        // загрузка пользовательского спрайта
        const spriteInput = document.getElementById('spriteUpload');
        spriteInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const img = new Image();
            img.onload = () => {
                playerSprite = img;
                // анализируем: ожидаем квадратную сетку, делим на 4x4
                const frameW = img.width / 4;
                const frameH = img.height / 4;
                if(frameW>0 && frameH>0){
                    spriteConfig.frameW = frameW;
                    spriteConfig.frameH = frameH;
                    spriteReady = true;
                } else { spriteReady = false; }
            };
            img.onerror = () => { alert("Не удалось загрузить изображение"); spriteReady=false; };
            img.src = URL.createObjectURL(file);
        });
        
        // направление -> индекс строки (0=вниз, 1=влево, 2=вправо, 3=вверх)
        function getDirectionRow(dirX, dirY) {
            if(Math.abs(dirX) > Math.abs(dirY)) {
                return dirX > 0 ? 2 : 1;   // вправо или влево
            } else {
                return dirY > 0 ? 0 : 3;   // вниз или вверх
            }
        }
        
        // отрисовка персонажа (спрайт либо fallback)
        function drawPlayer() {
            const px = player.x - camera.x;
            const py = player.y - camera.y;
            const centerX = px + PLAYER_W/2;
            const centerY = py + PLAYER_H/2;
            // тень
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.beginPath();
            ctx.ellipse(centerX+4, centerY+7, 22, 11, 0, 0, Math.PI*2);
            ctx.fill();
            
            if(spriteReady && playerSprite) {
                // анимация: кадр меняется каждые 0.2 секунды, три фазы (0,1,2)
                let animStep = 0;
                if(player.animTime > 0) {
                    animStep = Math.floor(player.animTime) % 3; // 0,1,2
                }
                let row = getDirectionRow(player.dirX, player.dirY);
                let col = animStep;
                let sx = col * spriteConfig.frameW;
                let sy = row * spriteConfig.frameH;
                let drawW = PLAYER_W;
                let drawH = PLAYER_H;
                let offsetX = centerX - drawW/2;
                let offsetY = centerY - drawH/2;
                ctx.drawImage(playerSprite, sx, sy, spriteConfig.frameW, spriteConfig.frameH, offsetX, offsetY, drawW, drawH);
                // легкий контур для читаемости
                ctx.strokeStyle = '#3a2a1a';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(offsetX+1, offsetY+1, drawW-2, drawH-2);
            } else {
                // fallback, если спрайт не загружен – рисуем объёмного человечка
                let bodyGrad = ctx.createLinearGradient(centerX-8, centerY-6, centerX+8, centerY+12);
                bodyGrad.addColorStop(0, '#628e84'); bodyGrad.addColorStop(1, '#3b6b5e');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath(); ctx.ellipse(centerX, centerY+3, 19, 21, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#2a5549';
                ctx.beginPath(); ctx.moveTo(centerX-16,centerY+2); ctx.quadraticCurveTo(centerX-6,centerY+18,centerX+14,centerY+2); ctx.fill();
                ctx.fillStyle = '#c9894b'; ctx.fillRect(centerX-12,centerY+5,24,5);
                ctx.fillStyle = '#4f786c';
                ctx.beginPath(); ctx.ellipse(centerX,centerY-9,15,16,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#faf4e0';
                let eyeX = (player.dirX!==0||player.dirY!==0)?player.dirX*2:0;
                let eyeY = (player.dirX!==0||player.dirY!==0)?player.dirY*1.5:1;
                ctx.beginPath(); ctx.ellipse(centerX-8+eyeX*0.4, centerY-12+eyeY*0.6, 4.2,4.8,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(centerX+5+eyeX*0.4, centerY-12+eyeY*0.6,4.2,4.8,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#1f2f28';
                ctx.beginPath(); ctx.ellipse(centerX-8+eyeX, centerY-11+eyeY*0.8,2.2,2.8,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(centerX+5+eyeX, centerY-11+eyeY*0.8,2.2,2.8,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(centerX-9+eyeX*0.7, centerY-12.5+eyeY*0.5,1,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(centerX+4+eyeX*0.7, centerY-12.5+eyeY*0.5,1,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(centerX+15,centerY-2); ctx.lineTo(centerX+26,centerY-12); ctx.lineTo(centerX+24,centerY-14); ctx.fillStyle='#c0a16b'; ctx.fill();
            }
        }
        
        // ----- ОТРИСОВКА ВСЕГО С СОРТИРОВКОЙ ПО ГЛУБИНЕ -----
        function renderScene() {
            updateCamera();
            drawGround();
            // собираем объекты для сортировки
            let objects = [];
            for(let w of walls) objects.push({type:'wall', y: w.y+w.h+22, draw:()=>drawWall(w)});
            for(let d of decorations) objects.push({type:'decor', y: d.y+12, draw:()=>drawDecor(d)});
            objects.push({type:'player', y: player.y+PLAYER_H, draw:()=>drawPlayer()});
            objects.sort((a,b)=>a.y - b.y);
            for(let obj of objects) obj.draw();
            // легкая дымка
            ctx.fillStyle = '#c0e0a030';
            ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
            const fog = ctx.createLinearGradient(0,0,0,CANVAS_H*0.5);
            fog.addColorStop(0,'#bcdd9a40'); fog.addColorStop(1,'transparent');
            ctx.fillStyle = fog; ctx.fillRect(0,0,CANVAS_W,CANVAS_H*0.4);
            // UI подсказки
            ctx.font = 'bold 12px system-ui'; ctx.fillStyle = '#ffefc0'; ctx.shadowBlur=0;
            ctx.fillText('📱 Сенсорные кнопки внизу', CANVAS_W-160, 25);
            if(!spriteReady) ctx.fillText('⬆️ Загрузите спрайт-лист персонажа (4x4 кадра)', 15, 30);
            else ctx.fillText('✔️ Свой спрайт загружен', 15, 30);
        }
        
        // ----- СОЗДАНИЕ ПРИМЕРНОГО ФАЙЛА СПРАЙТОВ (инструкция) -----
        function generateSampleSprite() {
            // создаём canvas и предлагаем скачать пример
            const canvasSpr = document.createElement('canvas');
            const size = 128; // 4x4, каждый кадр 32x32
            canvasSpr.width = size;
            canvasSpr.height = size;
            const ctxSpr = canvasSpr.getContext('2d');
            ctxSpr.fillStyle = '#3f786e';
            ctxSpr.fillRect(0,0,size,size);
            ctxSpr.fillStyle = '#f5d742';
            ctxSpr.font = 'bold 22px monospace';
            ctxSpr.textAlign = 'center';
            ctxSpr.fillText('★', size/2, size/2);
            ctxSpr.fillStyle = '#00000099';
            for(let i=0;i<4;i++) ctxSpr.strokeRect(i*32,0,32,32);
            for(let i=0;i<4;i++) ctxSpr.strokeRect(0,i*32,32,32);
            const link = document.createElement('a');
            link.download = 'example_sprite_4x4.png';
            link.href = canvasSpr.toDataURL();
            link.click();
        }
        // добавим возможность скачать пример, но не автоматически (по желанию)
        window.generateSample = generateSampleSprite;
        
        // Инструкция: в консоль или вывести кнопку? Добавим маленькую ссылку в панель
        const uploadDiv = document.querySelector('.upload-area');
        const sampleBtn = document.createElement('button');
        sampleBtn.innerText = '📥 Скачать пример спрайта';
        sampleBtn.style.background = '#c9a87b'; sampleBtn.style.border = 'none'; sampleBtn.style.borderRadius = '20px'; sampleBtn.style.marginLeft = '8px'; sampleBtn.style.padding = '2px 8px'; sampleBtn.style.fontSize = '10px';
        sampleBtn.onclick = () => generateSampleSprite();
        uploadDiv.appendChild(sampleBtn);
        
        // ----- АНИМАЦИОННЫЙ ЦИКЛ -----
        function gameLoop() {
            updateMovement();
            renderScene();
            requestAnimationFrame(gameLoop);
        }
        
        // предварительная корректировка стартовой позиции
        while(collision(player.x, player.y, PLAYER_W, PLAYER_H)) {
            player.x += 30; player.y += 30;
            if(player.x > WORLD_WIDTH-100) player.x = WORLD_WIDTH/2;
            if(player.y > WORLD_HEIGHT-100) player.y = WORLD_HEIGHT/2;
        }
        gameLoop();
    })();
</script>
</body>
</html>
