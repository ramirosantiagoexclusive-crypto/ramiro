<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Лучник: HitZones и стрелы</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a1f0a;
            font-family: 'Segoe UI', system-ui, monospace;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 48px;
            color: #f9eec1;
            pointer-events: none;
            z-index: 10;
            font-size: 1rem;
            font-weight: bold;
        }
        .stat span {
            color: #ffcf7a;
            font-size: 1.3rem;
            margin-right: 6px;
        }
        .restart-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #b87a3c;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            z-index: 20;
            font-family: monospace;
        }
        .arrow-selector {
            position: absolute;
            bottom: 100px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px;
            border-radius: 60px;
            width: fit-content;
            margin: 0 auto;
            pointer-events: auto;
            z-index: 20;
        }
        .arrow-btn {
            background: #2e241a;
            border: 2px solid #cf9f4a;
            color: #ffecb3;
            font-size: 0.9rem;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
        }
        .arrow-btn.active {
            background: #da943a;
            color: #1e1507;
            border-color: #ffd58c;
        }
        .upgrade-panel {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 60px;
            border: 1px solid #ffd966;
            transform: translateY(150%);
            transition: transform 0.3s;
            z-index: 25;
            pointer-events: auto;
        }
        .upgrade-panel.show {
            transform: translateY(0);
        }
        .upgrade-btn {
            background: #da943a;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 40px;
            color: #1e1507;
            cursor: pointer;
            box-shadow: 0 4px 0 #754a1a;
        }
        @media (max-width: 700px) {
            .ui-panel { font-size: 0.7rem; padding: 5px 12px; top: 10px; }
            .stat span { font-size: 1rem; }
            .arrow-btn { font-size: 0.7rem; padding: 4px 12px; }
            .upgrade-btn { padding: 6px 14px; font-size: 0.8rem; }
        }
    </style>
    <script src="libs/pixi.min.js"></script>
</head>
<body>
<div id="gameContainer">
    <div class="ui-panel">
        <div class="stat">🏰 <span id="baseHp">100</span></div>
        <div class="stat">💰 <span id="score">0</span></div>
        <div class="stat">🌀 <span id="waveNum">0</span></div>
        <div class="stat">👾 <span id="enemiesCount">0</span></div>
    </div>
    <button class="restart-btn" id="restartBtn">⚡ Новая игра</button>
    <div class="arrow-selector" id="arrowSelector">
        <button class="arrow-btn" data-type="normal">🏹 Обычная</button>
        <button class="arrow-btn" data-type="pierce">⚔️ Бронебойная</button>
        <button class="arrow-btn" data-type="fire">🔥 Зажигательная</button>
    </div>
    <div class="upgrade-panel" id="upgradePanel">
        <button class="upgrade-btn" id="upgradeDmg">💥 Урон +8</button>
        <button class="upgrade-btn" id="upgradeCrit">🎯 Крит. шанс +10%</button>
        <button class="upgrade-btn" id="upgradeSpeed">⚡ Скорострельность</button>
    </div>
</div>

<script>
    (function() {
        // ---------- PixiJS setup ----------
        const container = document.getElementById('gameContainer');
        const app = new PIXI.Application({
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: 0x1f3a1f,
            antialias: true,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true,
        });
        container.appendChild(app.view);

        const WORLD_W = 1100;
        const WORLD_H = 600;
        function resizeStage() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            app.renderer.resize(w, h);
            const scale = Math.min(w / WORLD_W, h / WORLD_H);
            app.stage.scale.set(scale);
            app.stage.x = (w - WORLD_W * scale) / 2;
            app.stage.y = (h - WORLD_H * scale) / 2;
        }
        window.addEventListener('resize', resizeStage);
        resizeStage();

        // ---------- Игровые константы ----------
        const GROUND_Y = 520;
        const ARCHER_X = 130;
        const ARCHER_Y = GROUND_Y - 18;
        const GRAVITY = 0.28;

        // Параметры лучника (базовые)
        let baseDamage = 28;
        let extraDamage = 0;
        let baseCritChance = 0.15;
        let extraCrit = 0;
        let baseCooldown = 28;       // кадры
        let cooldownReduction = 0;
        let currentDamage, currentCrit, currentCooldown;

        // Тип стрелы
        let currentArrowType = 'normal'; // normal, pierce, fire

        // Ресурсы
        let baseHealth = 100;
        let score = 0;
        let wave = 0;
        let gameActive = true;
        let waveActive = true;
        let waveTransition = 0;
        let canShoot = true;
        let shootTimer = 0;
        let upgradePanelOpen = false;

        // Динамические списки
        let enemies = [];
        let arrows = [];
        let particles = [];

        // Управление прицелом
        let dragging = false;
        let dragX = ARCHER_X, dragY = ARCHER_Y - 12;

        // Слои Pixi
        const bgLayer = new PIXI.Container();
        const enemyLayer = new PIXI.Container();
        const arrowLayer = new PIXI.Container();
        const effectLayer = new PIXI.Container();
        app.stage.addChild(bgLayer);
        app.stage.addChild(enemyLayer);
        app.stage.addChild(arrowLayer);
        app.stage.addChild(effectLayer);

        // Текстуры
        function makeCircleTex(color, rad) {
            const g = new PIXI.Graphics();
            g.beginFill(color);
            g.drawCircle(0, 0, rad);
            g.endFill();
            return app.renderer.generateTexture(g);
        }
        const texFootman = makeCircleTex(0xbc9a6c, 18);
        const texHeavy = makeCircleTex(0x8a6a4a, 22);
        const texSwift = makeCircleTex(0xdbba7a, 16);
        const texBrute = makeCircleTex(0xac5c3a, 28);
        const texArrow = makeCircleTex(0xffdd88, 6);
        const texFireArrow = makeCircleTex(0xff6633, 7);

        // Фон
        function drawBackground() {
            const g = new PIXI.Graphics();
            g.beginFill(0x4f6a3a);
            g.drawRect(0, 0, WORLD_W, GROUND_Y-40);
            g.beginFill(0x6b4e2a);
            g.drawRect(0, GROUND_Y, WORLD_W, WORLD_H - GROUND_Y + 8);
            for(let i=0;i<25;i++) g.drawRect(i*55, GROUND_Y-4, 32, 8);
            // замок
            g.beginFill(0xcfaa77);
            g.drawRect(35, GROUND_Y-56, 55, 62);
            g.beginFill(0xfad48b);
            g.drawRect(48, GROUND_Y-80, 30, 34);
            g.beginFill(0xffde9e);
            g.drawPolygon([30,GROUND_Y-56, 62,GROUND_Y-92, 95,GROUND_Y-56]);
            // лучник (фигурка)
            g.beginFill(0xe3aa66);
            g.drawCircle(ARCHER_X, ARCHER_Y-8, 14);
            g.beginFill(0xdaa06a);
            g.drawRect(ARCHER_X-8, ARCHER_Y-4, 16, 20);
            bgLayer.addChild(g);
        }
        drawBackground();

        // Враги с зонами
        class Enemy extends PIXI.Sprite {
            constructor(type, hp, speed, reward, radius, hasShield, hasHelmet) {
                let tex = texFootman;
                if (type === 'heavy') tex = texHeavy;
                else if (type === 'swift') tex = texSwift;
                else if (type === 'brute') tex = texBrute;
                super(tex);
                this.type = type;
                this.hp = hp;
                this.maxHp = hp;
                this.speed = speed;
                this.reward = reward;
                this.radius = radius;
                this.hasShield = hasShield;
                this.hasHelmet = hasHelmet;
                this.waypointIdx = 1;
                this.pos = { x: WORLD_W - 55, y: GROUND_Y - 12 };
                this.target = { x: WORLD_W - 200, y: GROUND_Y - 18 };
                this.alive = true;
                this.x = this.pos.x;
                this.y = this.pos.y;
                this.anchor.set(0.5);
                // текст HP
                this.hpText = new PIXI.Text(`${this.hp}`, { fontSize: 12, fill: 0xffefcf, stroke: '#000', strokeThickness: 2 });
                this.hpText.anchor.set(0.5);
                this.addChild(this.hpText);
            }
            update() {
                if (!this.alive) return;
                const dx = this.target.x - this.pos.x;
                const dy = this.target.y - this.pos.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 3) {
                    this.waypointIdx++;
                    const waypoints = [
                        { x: WORLD_W - 55, y: GROUND_Y - 12 },
                        { x: WORLD_W - 200, y: GROUND_Y - 18 },
                        { x: WORLD_W - 340, y: GROUND_Y - 6 },
                        { x: WORLD_W - 480, y: GROUND_Y - 14 },
                        { x: ARCHER_X + 45, y: GROUND_Y - 16 },
                        { x: 60, y: GROUND_Y - 10 }
                    ];
                    if (this.waypointIdx >= waypoints.length) {
                        const dmg = Math.floor(this.hp / 2 + 8);
                        baseHealth = Math.max(0, baseHealth - dmg);
                        updateUI();
                        this.alive = false;
                        this.destroy();
                        playSound('hit');
                        if (baseHealth <= 0) gameActive = false;
                        return;
                    }
                    this.target = waypoints[this.waypointIdx];
                } else {
                    const step = Math.min(this.speed, dist);
                    const angle = Math.atan2(dy, dx);
                    this.pos.x += Math.cos(angle) * step;
                    this.pos.y += Math.sin(angle) * step;
                    this.x = this.pos.x;
                    this.y = this.pos.y;
                }
                this.hpText.text = `${Math.ceil(this.hp)}`;
                this.hpText.x = 0;
                this.hpText.y = -this.radius - 6;
            }
            getHitZone(arrowX, arrowY) {
                // локальные координаты (центр врага в 0,0)
                const dx = arrowX - this.x;
                const dy = arrowY - this.y;
                const normY = dy / this.radius;
                // зоны по вертикали
                if (normY < -0.5) return 'head';
                if (normY > 0.4) return 'legs';
                // проверка щита (левый борт, т.к. враги идут слева направо)
                if (this.hasShield && dx < 0) return 'shield';
                return 'body';
            }
            takeDamage(amount, zone, arrowType) {
                let multiplier = 1.0;
                let isCrit = false;
                // множители зон
                if (zone === 'head') {
                    multiplier = this.hasHelmet ? 1.0 : 2.2;
                    if (!this.hasHelmet && Math.random() < currentCrit) isCrit = true;
                } else if (zone === 'shield') {
                    multiplier = 0.2; // почти полный блок
                } else if (zone === 'legs') {
                    multiplier = 0.7;
                } else { // body
                    multiplier = 1.0;
                }
                // бонус от типа стрелы
                let bonus = 1.0;
                if (arrowType === 'pierce' && zone === 'shield') bonus = 1.5; // бронебойная пробивает щит
                if (arrowType === 'fire') bonus = 1.2;
                let finalDamage = amount * multiplier * bonus;
                if (isCrit) finalDamage *= 2.5;
                this.hp -= finalDamage;
                // визуал урона
                showDamageNumber(this.x, this.y-this.radius-10, Math.floor(finalDamage), isCrit);
                if (this.hp <= 0) {
                    this.alive = false;
                    score += this.reward;
                    updateUI();
                    this.destroy();
                    playSound('death');
                    return true;
                } else {
                    playSound('hit');
                }
                return false;
            }
        }

        // Стрела
        class Arrow {
            constructor(x, y, vx, vy, type) {
                this.type = type;
                this.sprite = new PIXI.Sprite(type === 'fire' ? texFireArrow : texArrow);
                this.sprite.x = x;
                this.sprite.y = y;
                this.sprite.anchor.set(0.5);
                arrowLayer.addChild(this.sprite);
                this.vx = vx;
                this.vy = vy;
                this.active = true;
                this.hit = false;
            }
            update() {
                if (!this.active) return;
                this.sprite.x += this.vx;
                this.sprite.y += this.vy;
                this.vy += GRAVITY;
                // проверка границ земли
                if (this.sprite.y + 6 >= GROUND_Y || this.sprite.x < 0 || this.sprite.x > WORLD_W) {
                    this.destroy();
                    return;
                }
                // проверка попадания во врагов
                for (let i = 0; i < enemies.length; i++) {
                    const e = enemies[i];
                    if (!e.alive) continue;
                    const dx = this.sprite.x - e.x;
                    const dy = this.sprite.y - e.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < e.radius + 6) {
                        const zone = e.getHitZone(this.sprite.x, this.sprite.y);
                        let damage = currentDamage;
                        if (this.type === 'pierce') damage = currentDamage + 10;
                        if (this.type === 'fire') damage = currentDamage + 5;
                        e.takeDamage(damage, zone, this.type);
                        this.destroy();
                        break;
                    }
                }
            }
            destroy() {
                this.active = false;
                arrowLayer.removeChild(this.sprite);
                // добавить эффект
                createHitEffect(this.sprite.x, this.sprite.y);
            }
        }

        // Вспомогательные функции
        function showDamageNumber(x, y, dmg, crit) {
            const text = new PIXI.Text(`${dmg}${crit ? ' CRIT!' : ''}`, { fontSize: 14, fill: crit ? 0xff6666 : 0xffdd99, stroke: '#000', strokeThickness: 2 });
            text.x = x;
            text.y = y;
            effectLayer.addChild(text);
            let life = 1;
            const interval = setInterval(() => {
                life -= 0.02;
                text.alpha = life;
                text.y -= 1;
                if (life <= 0) {
                    clearInterval(interval);
                    effectLayer.removeChild(text);
                }
            }, 20);
        }

        function createHitEffect(x, y) {
            const g = new PIXI.Graphics();
            g.beginFill(0xffaa66);
            g.drawCircle(0,0,8);
            g.endFill();
            g.x = x; g.y = y;
            effectLayer.addChild(g);
            let alpha = 1;
            const fade = setInterval(() => {
                alpha -= 0.1;
                g.alpha = alpha;
                if (alpha <= 0) {
                    clearInterval(fade);
                    effectLayer.removeChild(g);
                }
            }, 30);
        }

        // Звуки (синтез)
        let audioCtx = null;
        function playSound(type) {
            if (!audioCtx) return;
            try {
                const ctx = audioCtx;
                const gain = ctx.createGain();
                const osc = ctx.createOscillator();
                osc.connect(gain);
                gain.connect(ctx.destination);
                gain.gain.value = 0.1;
                if (type === 'shoot') {
                    osc.frequency.value = 440;
                    gain.gain.exponentialRampToValue(0.0001, 0.15);
                    osc.start(); osc.stop(0.15);
                } else if (type === 'hit') {
                    osc.frequency.value = 220;
                    gain.gain.exponentialRampToValue(0.0001, 0.2);
                    osc.start(); osc.stop(0.2);
                } else if (type === 'death') {
                    osc.frequency.value = 120;
                    gain.gain.exponentialRampToValue(0.0001, 0.3);
                    osc.start(); osc.stop(0.3);
                }
            } catch(e) {}
        }

        // ----- Генерация волн (с разными shield/helmet) -----
        function generateWave(waveIdx) {
            const count = 4 + Math.floor(waveIdx * 0.6) + Math.floor(Math.random() * 2);
            const types = ['footman', 'heavy', 'swift'];
            if (waveIdx >= 3) types.push('brute');
            let enemiesList = [];
            for (let i = 0; i < count; i++) {
                let type = types[Math.floor(Math.random() * types.length)];
                let hasShield = false, hasHelmet = false;
                if (type === 'heavy') {
                    hasShield = Math.random() < 0.7;
                    hasHelmet = Math.random() < 0.5;
                } else if (type === 'brute') {
                    hasShield = true;
                    hasHelmet = true;
                } else if (type === 'footman') {
                    hasShield = Math.random() < 0.3;
                }
                enemiesList.push({ type, hasShield, hasHelmet });
            }
            return enemiesList;
        }

        function buildSpawnQueue(waveIdx) {
            const comp = generateWave(waveIdx);
            const queue = [];
            const scale = 1 + waveIdx * 0.12;
            for (let i = 0; i < comp.length; i++) {
                let c = comp[i];
                let baseHp = 44, baseSpeed = 1.1, reward = 28, radius = 18;
                if (c.type === 'heavy') { baseHp = 95; baseSpeed = 0.72; reward = 50; radius = 22; }
                else if (c.type === 'swift') { baseHp = 30; baseSpeed = 1.85; reward = 24; radius = 16; }
                else if (c.type === 'brute') { baseHp = 160; baseSpeed = 0.62; reward = 90; radius = 28; }
                const hp = Math.floor(baseHp * scale);
                const speed = baseSpeed * (1 - Math.min(0.25, waveIdx * 0.008));
                const rwd = Math.floor(reward * (1 + waveIdx * 0.05));
                queue.push({
                    type: c.type,
                    hp: hp,
                    speed: Math.max(0.55, speed),
                    reward: rwd,
                    radius: radius,
                    hasShield: c.hasShield,
                    hasHelmet: c.hasHelmet,
                    delay: 20 + i * 14
                });
            }
            // shuffle
            for (let i = queue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [queue[i], queue[j]] = [queue[j], queue[i]];
            }
            return queue;
        }

        let enemiesToSpawn = [];
        let spawnDelay = 0;

        function startWave(waveIdx) {
            enemiesToSpawn = buildSpawnQueue(waveIdx);
            spawnDelay = 10;
            waveActive = true;
            waveTransition = 0;
            document.getElementById('waveNum').innerText = waveIdx;
            playSound('shoot'); // просто звук начала
        }

        function updateWave() {
            if (!gameActive) return;
            if (waveTransition > 0) {
                waveTransition--;
                if (waveTransition === 0) startWave(wave);
                return;
            }
            if (waveActive) {
                if (enemiesToSpawn.length > 0) {
                    if (spawnDelay <= 0) {
                        const next = enemiesToSpawn.shift();
                        const enemy = new Enemy(next.type, next.hp, next.speed, next.reward, next.radius, next.hasShield, next.hasHelmet);
                        enemyLayer.addChild(enemy);
                        enemies.push(enemy);
                        spawnDelay = Math.max(18, 32 - Math.floor(wave / 2));
                    } else {
                        spawnDelay--;
                    }
                }
                if (enemies.length === 0 && enemiesToSpawn.length === 0 && waveActive) {
                    waveActive = false;
                    wave++;
                    updateUI();
                    waveTransition = 45;
                    showUpgradePanel();
                    playSound('shoot');
                }
            }
        }

        function showUpgradePanel() {
            document.getElementById('upgradePanel').classList.add('show');
            upgradePanelOpen = true;
            gameActive = false;
        }
        function hideUpgradePanel() {
            document.getElementById('upgradePanel').classList.remove('show');
            upgradePanelOpen = false;
            gameActive = true;
            startWave(wave);
        }

        // Выстрел
        function shoot(targetX, targetY) {
            if (!gameActive || !canShoot) return false;
            let dx = targetX - ARCHER_X;
            let dy = targetY - (ARCHER_Y - 12);
            let dist = Math.min(320, Math.hypot(dx, dy));
            if (dist < 20) return false;
            let angle = Math.atan2(dy, dx);
            let power = dist * 0.68;
            let vx = Math.cos(angle) * Math.min(power, 14.5);
            let vy = Math.sin(angle) * Math.min(power, 14.5);
            const arrow = new Arrow(ARCHER_X, ARCHER_Y - 12, vx, vy, currentArrowType);
            arrows.push(arrow);
            canShoot = false;
            shootTimer = currentCooldown;
            playSound('shoot');
            return true;
        }

        function updateArrows() {
            for (let i = 0; i < arrows.length; i++) {
                arrows[i].update();
                if (!arrows[i].active) {
                    arrows.splice(i, 1);
                    i--;
                }
            }
        }

        // Цикл игры
        function gameUpdate() {
            if (!gameActive && !upgradePanelOpen) return;
            updateWave();
            for (let i = 0; i < enemies.length; i++) {
                enemies[i].update();
                if (!enemies[i].alive) {
                    enemies.splice(i, 1);
                    i--;
                }
            }
            updateArrows();

            if (!upgradePanelOpen && gameActive) {
                if (!canShoot) {
                    shootTimer--;
                    if (shootTimer <= 0) canShoot = true;
                }
                if (baseHealth <= 0) {
                    gameActive = false;
                    alert('Поражение! Нажмите "Новая игра"');
                }
            }
            updateUI();
            requestAnimationFrame(gameUpdate);
        }

        function updateUI() {
            document.getElementById('baseHp').innerText = baseHealth;
            document.getElementById('score').innerText = Math.floor(score);
            document.getElementById('waveNum').innerText = wave;
            document.getElementById('enemiesCount').innerText = enemies.length;
        }

        // Апгрейды
        function applyUpgrade(upgrade) {
            if (upgrade === 'dmg') extraDamage += 8;
            else if (upgrade === 'crit') extraCrit = Math.min(extraCrit + 0.1, 0.6);
            else if (upgrade === 'speed') cooldownReduction = Math.min(cooldownReduction + 3, 14);
            currentDamage = baseDamage + extraDamage;
            currentCrit = Math.min(baseCritChance + extraCrit, 0.75);
            let cd = baseCooldown - cooldownReduction;
            if (cd < 12) cd = 12;
            currentCooldown = cd;
            hideUpgradePanel();
        }

        // Управление мышью/тач
        function getLocalCoords(e) {
            const rect = app.view.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let canvasX = (clientX - rect.left) * (app.view.width / rect.width);
            let canvasY = (clientY - rect.top) * (app.view.height / rect.height);
            return app.stage.toLocal({ x: canvasX, y: canvasY });
        }

        function onPointerStart(e) {
            e.preventDefault();
            if (!gameActive || upgradePanelOpen) return;
            dragging = true;
            const pos = getLocalCoords(e);
            dragX = pos.x;
            dragY = pos.y;
        }
        function onPointerMove(e) {
            if (!dragging) return;
            e.preventDefault();
            const pos = getLocalCoords(e);
            dragX = pos.x;
            dragY = pos.y;
        }
        function onPointerEnd(e) {
            if (!dragging) return;
            e.preventDefault();
            if (gameActive && !upgradePanelOpen && canShoot) {
                shoot(dragX, dragY);
            }
            dragging = false;
        }

        const view = app.view;
        view.addEventListener('mousedown', onPointerStart);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerEnd);
        view.addEventListener('touchstart', onPointerStart, { passive: false });
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerEnd);

        // Кнопки UI
        document.getElementById('restartBtn').onclick = () => location.reload();
        document.getElementById('upgradeDmg').onclick = () => applyUpgrade('dmg');
        document.getElementById('upgradeCrit').onclick = () => applyUpgrade('crit');
        document.getElementById('upgradeSpeed').onclick = () => applyUpgrade('speed');
        // Выбор стрел
        document.querySelectorAll('.arrow-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.arrow-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentArrowType = btn.dataset.type;
            };
        });
        document.querySelector('.arrow-btn').classList.add('active');

        // Прицел
        const aimGraphics = new PIXI.Graphics();
        app.stage.addChild(aimGraphics);
        function drawAim() {
            aimGraphics.clear();
            if (dragging && gameActive && !upgradePanelOpen) {
                aimGraphics.lineStyle(3, 0xfff5c0, 0.8);
                aimGraphics.moveTo(ARCHER_X, ARCHER_Y - 14);
                aimGraphics.lineTo(dragX, dragY);
                let dx = dragX - ARCHER_X;
                let dy = dragY - (ARCHER_Y - 14);
                let dist = Math.min(320, Math.hypot(dx, dy));
                if (dist > 20) {
                    let angle = Math.atan2(dy, dx);
                    let spd = dist * 0.68;
                    let vx = Math.cos(angle) * Math.min(spd, 14.5);
                    let vy = Math.sin(angle) * Math.min(spd, 14.5);
                    let px = ARCHER_X, py = ARCHER_Y - 14;
                    let vxt = vx, vyt = vy;
                    aimGraphics.moveTo(px, py);
                    for (let i = 0; i < 30; i++) {
                        px += vxt;
                        py += vyt;
                        vyt += GRAVITY;
                        if (py > GROUND_Y) break;
                        aimGraphics.lineTo(px, py);
                    }
                }
            }
            requestAnimationFrame(drawAim);
        }
        drawAim();

        // Инициализация
        currentDamage = baseDamage;
        currentCrit = baseCritChance;
        currentCooldown = baseCooldown;
        startWave(0);
        gameUpdate();

        // Активация звука
        view.addEventListener('touchstart', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.resume();
            }
        }, { once: true });
    })();
</script>
</body>
</html>
