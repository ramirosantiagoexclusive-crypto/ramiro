<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2.5D Adventure - Босс работает + джойстики</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a2a22;
            overflow: hidden;
            touch-action: none; /* важно для nipplejs */
            font-family: system-ui, 'Segoe UI', monospace;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* pointer-events: none; УБРАНО, чтобы не мешать джойстикам, но они всё равно поверх */
            z-index: 0;
        }
        .joystick-area {
            position: fixed;
            bottom: 0;
            width: 50%;
            height: 50%;
            touch-action: none;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .move-area { left: 0; }
        .attack-area { right: 0; }
        .ui {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            z-index: 200;
            pointer-events: none;
            display: flex;
            gap: 20px;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }
        .weapon-info {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 20px;
            color: #ffcc66;
            font-weight: bold;
            z-index: 200;
            pointer-events: none;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }
        .reload-bar {
            position: fixed;
            bottom: 120px;
            right: 30px;
            width: 60px;
            height: 6px;
            background: #444;
            border-radius: 3px;
            overflow: hidden;
            z-index: 200;
        }
        .reload-fill {
            width: 100%;
            height: 100%;
            background: #ffaa44;
            transition: width 0.05s;
        }
        .boss-bar {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 18px;
            background: #3a1a1a;
            border-radius: 12px;
            border: 2px solid #d66;
            overflow: hidden;
            z-index: 200;
            display: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .boss-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #d44, #f66);
        }
        .death-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }
        .death-window {
            background: #2a1f1a;
            padding: 20px 30px;
            border-radius: 30px;
            text-align: center;
            color: #ffaa88;
            border: 2px solid #ff8844;
        }
        .death-window button {
            background: #ff8844;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .instruction {
            position: fixed;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            color: #ccc;
            font-size: 10px;
            background: rgba(0,0,0,0.4);
            width: fit-content;
            margin: 0 auto;
            padding: 2px 8px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 200;
        }
        @media (max-width: 700px) {
            .ui, .weapon-info { font-size: 12px; }
            .reload-bar { bottom: 100px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="joystick-area move-area" id="moveArea"></div>
    <div class="joystick-area attack-area" id="attackArea"></div>
    
    <div class="ui">❤️ <span id="hp">100</span> &nbsp;| 🧟 <span id="kills">0</span></div>
    <div class="weapon-info" id="weaponInfo">🗡️ Меч (28)</div>
    <div class="reload-bar"><div class="reload-fill" id="reloadFill"></div></div>
    <div class="boss-bar" id="bossBar"><div class="boss-fill" id="bossFill"></div></div>
    <div class="instruction">👉 Левая зона — движение | Правая зона — атака (направление от центра)</div>

    <script>
        (function(){
            const WORLD_W = 2600, WORLD_H = 2300;
            const PLAYER_W = 34, PLAYER_H = 34;
            const SPEED = 5.2;
            
            let canvas = document.getElementById('canvas');
            let ctx = canvas.getContext('2d');
            let gameActive = true;
            let lastTimestamp = 0;
            
            let player = {
                x: WORLD_W/2, y: WORLD_H/2,
                dirX: 0, dirY: 1,
                anim: 0,
                hp: 100, maxHp: 100,
                invTimer: 0,
                kills: 0
            };
            
            const weaponsLib = [
                { type:0, name:"Меч", damage:28, delay:0.5, range:75, projSpeed:0, color:"#c0a16b", emoji:"🗡️", knockback:28 },
                { type:1, name:"Арбалет", damage:18, delay:0.8, range:500, projSpeed:9, color:"#b87c4f", emoji:"🏹", knockback:0 },
                { type:2, name:"Посох", damage:42, delay:1.1, range:550, projSpeed:7, color:"#aa66ff", emoji:"🔮", knockback:10 }
            ];
            let weapon = { ...weaponsLib[0], cd: 0 };
            
            let enemies = [];
            let projectiles = [];
            let particles = [];
            let medkits = [];
            let items = [];
            let walls = [];
            let decor = [];
            
            let boss = null;
            let bossDefeated = false;
            
            let spawnTimer = 0;
            let camera = { x:0, y:0 };
            
            let moveVec = {x:0, y:0};
            let meleeSwing = { active: false, angle: 0, timer: 0, duration: 0.15, x:0, y:0 };
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            
            // ---------- ОБЫЧНЫЙ ВРАГ ----------
            class Enemy {
                constructor(x, y, type="normal") {
                    this.x = x; this.y = y; this.w = 32; this.h = 32;
                    this.type = type;
                    if(type === "fast") {
                        this.hp = 30; this.maxHp = 30; this.speed = 2.2; this.color = "#c44";
                    } else if(type === "tank") {
                        this.hp = 100; this.maxHp = 100; this.speed = 0.8; this.color = "#48a";
                    } else {
                        this.hp = 45; this.maxHp = 45; this.speed = 1.3; this.color = "#4a6e5c";
                    }
                    this.attackTimer = 0;
                }
                update(delta) {
                    let dx = player.x + PLAYER_W/2 - (this.x + this.w/2);
                    let dy = player.y + PLAYER_H/2 - (this.y + this.h/2);
                    let len = Math.hypot(dx, dy);
                    if(len > 0.1) {
                        dx /= len; dy /= len;
                        this.x += dx * this.speed;
                        this.y += dy * this.speed;
                    }
                    this.x = Math.min(Math.max(this.x, 0), WORLD_W - this.w);
                    this.y = Math.min(Math.max(this.y, 0), WORLD_H - this.h);
                    
                    if(this.attackTimer <= 0 && Math.hypot(this.x+this.w/2 - (player.x+PLAYER_W/2), this.y+this.h/2 - (player.y+PLAYER_H/2)) < 40) {
                        if (player.invTimer <= 0) {
                            player.hp -= 12;
                            player.invTimer = 0.7;
                        }
                        this.attackTimer = 0.8;
                    }
                    if(this.attackTimer > 0) this.attackTimer -= delta;
                }
                draw(cam) {
                    let x = this.x - cam.x, y = this.y - cam.y;
                    if(x + this.w < 0 || x > canvas.width || y + this.h < 0 || y > canvas.height) return;
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.beginPath(); ctx.ellipse(x+this.w/2+2, y+this.h-3, this.w/2+4,6,0,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle = this.color; ctx.fillRect(x, y, this.w, this.h);
                    ctx.fillStyle = '#2f5442'; ctx.fillRect(x+5, y-5, this.w-10, 8);
                    ctx.fillStyle = '#ffaaaa'; ctx.beginPath(); ctx.arc(x+this.w*0.3, y+this.h*0.4,4,0,Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x+this.w*0.7, y+this.h*0.4,4,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x+this.w*0.3-1, y+this.h*0.4-1,1.5,0,Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x+this.w*0.7-1, y+this.h*0.4-1,1.5,0,Math.PI*2); ctx.fill();
                    let pct = this.hp / this.maxHp;
                    ctx.fillStyle = '#900'; ctx.fillRect(x, y-8, this.w, 4);
                    ctx.fillStyle = '#0a0'; ctx.fillRect(x, y-8, this.w * pct, 4);
                }
                takeDamage(amount, knockbackDir) {
                    this.hp -= amount;
                    if(knockbackDir && weapon.knockback) {
                        let kb = weapon.knockback;
                        this.x += knockbackDir.x * kb;
                        this.y += knockbackDir.y * kb;
                        this.x = Math.min(Math.max(this.x,0), WORLD_W-this.w);
                        this.y = Math.min(Math.max(this.y,0), WORLD_H-this.h);
                    }
                    return this.hp <= 0;
                }
            }
            
            // ---------- БОСС НАСЛЕДУЕТ ВСЁ ОТ ENEMY, НО МЕНЯЕМ ПАРАМЕТРЫ ----------
            class Boss extends Enemy {
                constructor(x, y) {
                    super(x, y, "boss");
                    this.w = 76;
                    this.h = 76;
                    this.hp = 480;
                    this.maxHp = 480;
                    this.speed = 3.2;
                    this.attackRadius = 70;
                    this.attackDamage = 34;
                    this.phase = 1;
                    this.swingActive = false;
                    this.swingTimer = 0;
                    this.attackTimer = 0;
                }
                
                update(delta) {
                    // Движение — полная копия из Enemy (работает)
                    let dx = player.x + PLAYER_W/2 - (this.x + this.w/2);
                    let dy = player.y + PLAYER_H/2 - (this.y + this.h/2);
                    let len = Math.hypot(dx, dy);
                    if(len > 0.1) {
                        dx /= len; dy /= len;
                        this.x += dx * this.speed;
                        this.y += dy * this.speed;
                    }
                    this.x = Math.min(Math.max(this.x, 0), WORLD_W - this.w);
                    this.y = Math.min(Math.max(this.y, 0), WORLD_H - this.h);
                    
                    // Атака с увеличенным радиусом
                    const distToPlayer = Math.hypot(this.x+this.w/2 - (player.x+PLAYER_W/2), this.y+this.h/2 - (player.y+PLAYER_H/2));
                    if (this.attackTimer <= 0 && distToPlayer < this.attackRadius) {
                        if (player.invTimer <= 0) {
                            player.hp -= this.attackDamage;
                            player.invTimer = 0.6;
                            for (let i = 0; i < 15; i++) {
                                particles.push({
                                    x: player.x + PLAYER_W/2 + (Math.random()-0.5)*30,
                                    y: player.y + PLAYER_H/2 + (Math.random()-0.5)*30,
                                    life: 0.3,
                                    vx: (Math.random()-0.5)*5,
                                    vy: (Math.random()-0.5)*5,
                                    color: "#ff6666"
                                });
                            }
                            this.swingActive = true;
                            this.swingTimer = 0.2;
                        }
                        this.attackTimer = 0.9;
                    }
                    if (this.attackTimer > 0) this.attackTimer -= delta;
                    
                    if (this.swingActive) {
                        this.swingTimer -= delta;
                        if (this.swingTimer <= 0) this.swingActive = false;
                    }
                    
                    if (this.hp <= this.maxHp * 0.5 && this.phase === 1) {
                        this.phase = 2;
                        this.speed = 4.8;
                        for (let i = 0; i < 40; i++) {
                            particles.push({
                                x: this.x + this.w/2, y: this.y + this.h/2,
                                life: 0.6, vx: (Math.random() - 0.5) * 10,
                                vy: (Math.random() - 0.5) * 10, color: "#ff6644"
                            });
                        }
                    }
                }
                
                draw(cam) {
                    let x = this.x - cam.x, y = this.y - cam.y;
                    if (x + this.w < 0 || x > canvas.width || y + this.h < 0 || y > canvas.height) return;
                    
                    ctx.fillStyle = 'rgba(0,0,0,0.55)';
                    ctx.beginPath(); ctx.ellipse(x + this.w/2 + 4, y + this.h - 8, this.w/2 + 8, 12, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#4a2a2a'; ctx.fillRect(x, y, this.w, this.h);
                    ctx.fillStyle = '#7a5a4a'; ctx.fillRect(x + 8, y - 10, this.w - 16, 14);
                    ctx.fillStyle = '#b87c4f'; ctx.fillRect(x + 12, y - 6, this.w - 24, 8);
                    ctx.fillStyle = '#8b5a3c'; ctx.fillRect(x + 10, y + 15, this.w - 20, 35);
                    ctx.fillStyle = '#c99a6b'; ctx.fillRect(x + 20, y + 25, this.w - 40, 12);
                    ctx.fillStyle = '#5a3a2a'; ctx.fillRect(x + 15, y - 6, this.w - 30, 18);
                    ctx.fillStyle = '#a66';
                    ctx.beginPath(); ctx.moveTo(x + 12, y - 4); ctx.lineTo(x + 26, y - 14); ctx.lineTo(x + 34, y - 4); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(x + this.w - 12, y - 4); ctx.lineTo(x + this.w - 26, y - 14); ctx.lineTo(x + this.w - 34, y - 4); ctx.fill();
                    ctx.fillStyle = '#ff6600';
                    ctx.beginPath(); ctx.arc(x + this.w*0.35, y + this.h*0.3, 7, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x + this.w*0.65, y + this.h*0.3, 7, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ffcc44';
                    ctx.beginPath(); ctx.arc(x + this.w*0.35 - 1, y + this.h*0.3 - 1, 2.8, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x + this.w*0.65 - 1, y + this.h*0.3 - 1, 2.8, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#bbb';
                    ctx.fillRect(x + this.w - 22, y + this.h*0.6, 30, 10);
                    ctx.fillStyle = '#eecc88';
                    ctx.fillRect(x + this.w - 14, y + this.h*0.55, 18, 6);
                    
                    if (this.swingActive) {
                        const cx = x + this.w/2, cy = y + this.h/2;
                        ctx.beginPath(); ctx.arc(cx, cy, this.attackRadius - 5, 0, Math.PI*2);
                        ctx.strokeStyle = '#ffaa33'; ctx.lineWidth = 10; ctx.stroke();
                        ctx.beginPath(); ctx.arc(cx, cy, this.attackRadius - 12, 0, Math.PI*2);
                        ctx.strokeStyle = '#ffdd77'; ctx.lineWidth = 5; ctx.stroke();
                    }
                    
                    const pct = this.hp / this.maxHp;
                    const bossFill = document.getElementById('bossFill');
                    if (bossFill) bossFill.style.width = (pct * 100) + '%';
                    if (this.phase === 2) {
                        ctx.fillStyle = 'rgba(255,100,50,0.5)'; ctx.fillRect(x, y, this.w, 8);
                    }
                }
                
                takeDamage(amount) {
                    this.hp -= amount;
                    for (let i = 0; i < 12; i++) {
                        particles.push({
                            x: this.x + this.w/2 + (Math.random() - 0.5) * 30,
                            y: this.y + this.h/2 + (Math.random() - 0.5) * 30,
                            life: 0.28, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, color: "#c44"
                        });
                    }
                    return this.hp <= 0;
                }
                
                collidesWithPlayer() {
                    const pCenterX = player.x + PLAYER_W/2, pCenterY = player.y + PLAYER_H/2;
                    const bCenterX = this.x + this.w/2, bCenterY = this.y + this.h/2;
                    return Math.hypot(pCenterX - bCenterX, pCenterY - bCenterY) < (PLAYER_W/2 + this.w/2 + 10);
                }
            }
            
            // --- ФУНКЦИИ МИРА ---
            function addWall(x,y,w,h){ walls.push({x,y,w,h}); }
            function spawnEnemy() {
                let types = ["normal", "fast", "tank"];
                let type = types[Math.floor(Math.random()*types.length)];
                let x = player.x + (Math.random()-0.5)*700, y = player.y + (Math.random()-0.5)*700;
                x = Math.min(Math.max(x,80), WORLD_W-80); y = Math.min(Math.max(y,80), WORLD_H-80);
                if(Math.hypot(x-player.x, y-player.y) < 200) return;
                enemies.push(new Enemy(x,y,type));
            }
            
            function spawnBoss() {
                if (boss || bossDefeated) return;
                let spawnX = player.x + (Math.random() - 0.5) * 400, spawnY = player.y + (Math.random() - 0.5) * 400;
                spawnX = Math.min(Math.max(spawnX, 100), WORLD_W - 100);
                spawnY = Math.min(Math.max(spawnY, 100), WORLD_H - 100);
                boss = new Boss(spawnX, spawnY);
                document.getElementById('bossBar').style.display = 'block';
                for (let i = 0; i < 55; i++) {
                    particles.push({
                        x: spawnX + 38, y: spawnY + 38,
                        life: 0.7, vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12, color: "#ff8844"
                    });
                }
            }
            
            function spawnMedkit(x,y){ medkits.push({x,y, w:20, h:20}); }
            function scatterMedkits(){
                for(let i=0;i<8;i++){
                    let x=150+Math.random()*(WORLD_W-300), y=150+Math.random()*(WORLD_H-300);
                    let ok=true;
                    for(let w of walls) if(x<w.x+w.w+30 && x+30>w.x && y<w.y+w.h+30 && y+30>w.y) ok=false;
                    if(ok) spawnMedkit(x,y); else spawnMedkit(500+i*150, 500+i*100);
                }
            }
            function addItem(x,y,idx){ items.push({x,y,w:26,h:26,weaponIdx:idx}); }
            function scatterItems(){
                for(let i=0;i<weaponsLib.length;i++){
                    let placed=false;
                    for(let t=0;t<20;t++){
                        let x=150+Math.random()*(WORLD_W-300), y=150+Math.random()*(WORLD_H-300);
                        let ok=true;
                        for(let w of walls) if(x<w.x+w.w+30 && x+30>w.x && y<w.y+w.h+30 && y+30>w.y) ok=false;
                        if(ok && Math.hypot(x-player.x, y-player.y)>200){ addItem(x,y,i); placed=true; break; }
                    }
                    if(!placed) addItem(500+i*200, 500+i*150, i);
                }
            }
            
            // --- СТЕНЫ ---
            const wallData = [[200,300,70,70],[450,500,60,60],[700,200,80,80],[1000,600,75,75],[1300,350,70,70],[1600,700,90,55],[1900,400,80,80],[2200,800,85,85],[2500,300,70,70],[300,1300,200,40],[600,1400,40,180],[900,1350,140,40],[1200,1650,55,190],[1500,1500,180,45],[1800,1800,50,140],[2100,1450,80,80],[2300,1950,120,50],[100,2000,80,80],[300,2150,70,100],[80,700,90,70],[60,1100,80,80],[2700,2050,100,90],[2600,2250,110,60],[2850,700,90,90],[2750,400,120,55],[2800,1400,75,130],[1500,1150,100,100],[1380,1050,55,135],[1620,1080,55,125],[900,2050,45,45],[1150,2120,50,50],[1950,2100,55,55],[2250,650,50,50],[2450,1900,60,60]];
            wallData.forEach(w => addWall(w[0],w[1],w[2],w[3]));
            for(let i=0;i<180;i++) decor.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H });
            
            // --- УПРАВЛЕНИЕ (NippleJS) ---
            if (typeof nipplejs !== 'undefined') {
                nipplejs.create({ zone: document.getElementById('moveArea'), mode: 'static', size: 120, color: '#d4c29b', restOpacity: 0.7, shape: 'circle' })
                    .on('move', (evt, nipple) => { const v = nipple.vector; moveVec.x = v.x; moveVec.y = -v.y; })
                    .on('end', () => { moveVec = {x:0, y:0}; });
                nipplejs.create({ zone: document.getElementById('attackArea'), mode: 'static', size: 110, color: '#ff8844', restOpacity: 0.7, shape: 'circle' })
                    .on('move', (evt, nipple) => { const v = nipple.vector; let dx=v.x, dy=-v.y; let len=Math.hypot(dx,dy); if(len>0.01){ dx/=len; dy/=len; } else { dx=1; dy=0; } performAttack({x:dx, y:dy}); })
                    .on('end', () => {});
            }
            document.getElementById('attackArea').addEventListener('click', (e) => {
                let dx = e.clientX - (player.x - camera.x + PLAYER_W/2);
                let dy = e.clientY - (player.y - camera.y + PLAYER_H/2);
                let len = Math.hypot(dx, dy);
                if (len>0.01) { dx/=len; dy/=len; } else { dx=1; dy=0; }
                if(weapon.cd<=0) performAttack({x:dx, y:dy});
            });
            
            // --- АТАКА ИГРОКА ---
            function performAttack(dir) {
                if (weapon.cd > 0) return;
                if (weapon.type === 0) {
                    let ax = player.x + PLAYER_W/2, ay = player.y + PLAYER_H/2;
                    let hit = false;
                    for (let i = 0; i < enemies.length; i++) {
                        let e = enemies[i], ex = e.x + e.w/2, ey = e.y + e.h/2;
                        if (Math.hypot(ax - ex, ay - ey) < weapon.range) {
                            let kbDir = { x: ex-ax, y: ey-ay }; let kblen = Math.hypot(kbDir.x, kbDir.y);
                            if(kblen>0.01){ kbDir.x/=kblen; kbDir.y/=kblen; }
                            let dead = e.takeDamage(weapon.damage, kbDir); hit = true;
                            for(let p=0;p<8;p++) particles.push({ x:ex, y:ey, life:0.3, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, color:"#f44" });
                            if(dead) { enemies.splice(i,1); player.kills++; document.getElementById('kills').innerText = player.kills; i--; }
                        }
                    }
                    if (boss && Math.hypot(ax - (boss.x+boss.w/2), ay - (boss.y+boss.h/2)) < weapon.range+30) {
                        let dead = boss.takeDamage(weapon.damage); hit = true;
                        for(let p=0;p<16;p++) particles.push({ x:boss.x+boss.w/2, y:boss.y+boss.h/2, life:0.4, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, color:"#f80" });
                        if(dead) { boss=null; bossDefeated=true; document.getElementById('bossBar').style.display='none'; }
                    }
                    if(hit) {
                        meleeSwing.active = true; meleeSwing.timer = meleeSwing.duration;
                        meleeSwing.angle = Math.atan2(dir.y, dir.x);
                        meleeSwing.x = ax; meleeSwing.y = ay;
                        for(let i=0;i<15;i++) particles.push({ x:ax, y:ay, life:0.25, vx:Math.cos(Math.atan2(dir.y,dir.x)+(Math.random()-0.5))*6, vy:Math.sin(Math.atan2(dir.y,dir.x)+(Math.random()-0.5))*6, color:"#ffcc88" });
                    }
                } else {
                    projectiles.push({
                        x: player.x+PLAYER_W/2, y: player.y+PLAYER_H/2,
                        vx: dir.x * weapon.projSpeed, vy: dir.y * weapon.projSpeed,
                        damage: weapon.damage, traveled: 0, range: weapon.range,
                        size: 8, color: weapon.color
                    });
                }
                weapon.cd = weapon.delay;
            }
            
            // --- ДВИЖЕНИЕ И СТОЛКНОВЕНИЯ ---
            let keyState = { w:false,s:false,a:false,d:false,ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false };
            window.addEventListener('keydown', (e)=>{ if(keyState.hasOwnProperty(e.key)) { keyState[e.key]=true; e.preventDefault(); } if(e.key===' '||e.key==='Space') { e.preventDefault(); if(weapon.cd<=0) performAttack({x:player.dirX||1, y:player.dirY||0}); } });
            window.addEventListener('keyup', (e)=>{ if(keyState.hasOwnProperty(e.key)) keyState[e.key]=false; });
            
            function collision(x,y,w,h){
                if(x<0 || y<0 || x+w>WORLD_W || y+h>WORLD_H) return true;
                for(let wa of walls) if(x<wa.x+wa.w && x+w>wa.x && y<wa.y+wa.h && y+h>wa.y) return true;
                return false;
            }
            
            function movePlayer() {
                let mx = 0, my = 0;
                if (keyState.w || keyState.ArrowUp) my -= 1;
                if (keyState.s || keyState.ArrowDown) my += 1;
                if (keyState.a || keyState.ArrowLeft) mx -= 1;
                if (keyState.d || keyState.ArrowRight) mx += 1;
                if (moveVec.x !== 0 || moveVec.y !== 0) { mx += moveVec.x; my += moveVec.y; }
                let len = Math.hypot(mx, my);
                if (len > 0) { mx /= len; my /= len; }
                if (mx !== 0 || my !== 0) { player.dirX = mx; player.dirY = my; player.anim += 0.2; } else player.anim = 0;
                let newX = player.x + mx * SPEED, newY = player.y + my * SPEED;
                if (!collision(newX, player.y, PLAYER_W, PLAYER_H)) player.x = newX;
                if (!collision(player.x, newY, PLAYER_W, PLAYER_H)) player.y = newY;
                for(let e of enemies){
                    let overlapX = (player.x+PLAYER_W/2)-(e.x+e.w/2), overlapY = (player.y+PLAYER_H/2)-(e.y+e.h/2);
                    let dist = Math.hypot(overlapX, overlapY);
                    let minDist = (PLAYER_W/2 + e.w/2);
                    if(dist < minDist){
                        let angle = Math.atan2(overlapY, overlapX);
                        let push = (minDist - dist) * 0.9;
                        player.x += Math.cos(angle)*push; player.y += Math.sin(angle)*push;
                        e.x -= Math.cos(angle)*push*0.6; e.y -= Math.sin(angle)*push*0.6;
                        player.x = Math.min(Math.max(player.x,0), WORLD_W-PLAYER_W);
                        player.y = Math.min(Math.max(player.y,0), WORLD_H-PLAYER_H);
                        e.x = Math.min(Math.max(e.x,0), WORLD_W-e.w);
                        e.y = Math.min(Math.max(e.y,0), WORLD_H-e.h);
                    }
                }
                if(boss && boss.collidesWithPlayer()){
                    let angle = Math.atan2((player.y+PLAYER_H/2)-(boss.y+boss.h/2), (player.x+PLAYER_W/2)-(boss.x+boss.w/2));
                    player.x += Math.cos(angle)*15;
                    player.y += Math.sin(angle)*15;
                    player.x = Math.min(Math.max(player.x,0), WORLD_W-PLAYER_W);
                    player.y = Math.min(Math.max(player.y,0), WORLD_H-PLAYER_H);
                }
            }
            
            // --- ЛОГИКА СНАРЯДОВ, ПРЕДМЕТОВ ---
            function updateProjectiles(delta) {
                for (let i=0;i<projectiles.length;i++) {
                    let p = projectiles[i];
                    p.x += p.vx; p.y += p.vy;
                    p.traveled += Math.hypot(p.vx, p.vy);
                    let hit = false;
                    for(let w of walls) if(p.x>w.x && p.x<w.x+w.w && p.y>w.y && p.y<w.y+w.h) { hit=true; break; }
                    if(p.traveled > p.range || hit || p.x<0 || p.x>WORLD_W || p.y<0 || p.y>WORLD_H) { projectiles.splice(i,1); i--; continue; }
                    for(let j=0;j<enemies.length;j++) {
                        let e=enemies[j];
                        if(p.x>e.x && p.x<e.x+e.w && p.y>e.y && p.y<e.y+e.h){
                            e.hp -= p.damage; projectiles.splice(i,1);
                            for(let pt=0;pt<5;pt++) particles.push({ x:p.x, y:p.y, life:0.2, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2, color:"#ffa" });
                            if(e.hp<=0) { enemies.splice(j,1); player.kills++; document.getElementById('kills').innerText=player.kills; j--; }
                            break;
                        }
                    }
                    if(boss && p.x>boss.x && p.x<boss.x+boss.w && p.y>boss.y && p.y<boss.y+boss.h) {
                        let dead = boss.takeDamage(p.damage); projectiles.splice(i,1);
                        for(let pt=0;pt<8;pt++) particles.push({ x:p.x, y:p.y, life:0.3, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3, color:"#f80" });
                        if(dead) { boss=null; bossDefeated=true; document.getElementById('bossBar').style.display='none'; }
                    }
                }
            }
            function checkMedkits(){
                for(let i=0;i<medkits.length;i++){
                    let m=medkits[i];
                    if(Math.abs(player.x+PLAYER_W/2 - (m.x+m.w/2)) < 25 && Math.abs(player.y+PLAYER_H/2 - (m.y+m.h/2)) < 25){
                        player.hp = Math.min(player.maxHp, player.hp+20);
                        medkits.splice(i,1); i--;
                        for(let p=0;p<10;p++) particles.push({ x:m.x+m.w/2, y:m.y+m.h/2, life:0.4, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2, color:"#0f0" });
                    }
                }
            }
            function checkPickup() {
                for(let i=0;i<items.length;i++){
                    let it=items[i];
                    if(Math.abs(player.x - it.x) < 40 && Math.abs(player.y - it.y) < 40){
                        weapon = { ...weaponsLib[it.weaponIdx], cd:0 };
                        document.getElementById('weaponInfo').innerHTML = `${weapon.emoji} ${weapon.name} (${weapon.damage})`;
                        items.splice(i,1); break;
                    }
                }
            }
            
            // --- ОБНОВЛЕНИЯ ---
            function updateCooldowns(delta) {
                if (weapon.cd > 0) { weapon.cd -= delta; let fill = 1 - weapon.cd/weapon.delay; document.getElementById('reloadFill').style.width = (fill*100)+'%'; }
                else document.getElementById('reloadFill').style.width = '100%';
                if (meleeSwing.active) { meleeSwing.timer -= delta; if(meleeSwing.timer<=0) meleeSwing.active=false; }
                if (player.invTimer > 0) player.invTimer -= delta;
                if (player.hp > player.maxHp) player.hp = player.maxHp;
                document.getElementById('hp').innerText = Math.floor(player.hp);
                for(let i=0;i<particles.length;i++){
                    particles[i].life -= delta;
                    if(particles[i].life<=0){ particles.splice(i,1); i--; continue; }
                    particles[i].x += particles[i].vx; particles[i].y += particles[i].vy;
                }
            }
            function updateSpawning(delta) {
                if (boss || bossDefeated) return;
                spawnTimer += delta;
                if (spawnTimer > 5.0 && enemies.length < 7) { spawnTimer = 0; spawnEnemy(); }
                if (!boss && !bossDefeated && player.kills >= 5) spawnBoss();
                if (boss) boss.update(delta);
            }
            function updateEnemies(delta) { for(let e of enemies) e.update(delta); }
            function updateCamera() {
                let tx = player.x + PLAYER_W/2 - canvas.width/2, ty = player.y + PLAYER_H/2 - canvas.height/2;
                camera.x = Math.min(Math.max(0, tx), WORLD_W - canvas.width);
                camera.y = Math.min(Math.max(0, ty), WORLD_H - canvas.height);
            }
            
            // --- ОТРИСОВКА (полная) ---
            function drawGround() {
                let grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
                grad.addColorStop(0, '#5d9652'); grad.addColorStop(1, '#2b522c');
                ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);
                for(let i=0;i<600;i++) {
                    let wx = (i*311)%WORLD_W, wy = (i*457)%WORLD_H, sx = wx-camera.x, sy = wy-camera.y;
                    if(sx>0 && sx<canvas.width && sy>0 && sy<canvas.height){ ctx.fillStyle = 'rgba(210,240,120,0.25)'; ctx.beginPath(); ctx.arc(sx,sy,1.5,0,Math.PI*2); ctx.fill(); }
                }
            }
            function drawWalls() { for(let w of walls){ let x=w.x-camera.x, y=w.y-camera.y; if(x+w.w<0||x>canvas.width||y+w.h<0||y>canvas.height) continue; ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(x+w.w/2+2,y+w.h-3,w.w/2+4,8,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#5f5035'; ctx.fillRect(x,y+22,w.w,w.h); ctx.fillStyle='#b39d6b'; ctx.beginPath(); ctx.moveTo(x,y+22); ctx.lineTo(x+w.w,y+22); ctx.lineTo(x+w.w-5,y); ctx.lineTo(x+5,y); ctx.fill(); ctx.fillStyle='#473d28'; ctx.fillRect(x+w.w-6,y+20,6,w.h); } }
            function drawDecor() { for(let d of decor){ let x=d.x-camera.x, y=d.y-camera.y; if(x>-50&&x<canvas.width+50&&y>-50&&y<canvas.height+50) { ctx.fillStyle='#4c7a3a'; ctx.beginPath(); ctx.ellipse(x,y-4,10,7,0,0,Math.PI*2); ctx.fill(); } } }
            function drawItems() {
                for(let it of items){ let x=it.x-camera.x, y=it.y-camera.y; if(x<-30||x>canvas.width+30) continue; ctx.fillStyle='#ffcc77'; ctx.fillRect(x,y,it.w,it.h); ctx.fillStyle='#aa8844'; ctx.fillRect(x+4,y+4,it.w-8,it.h-8); ctx.fillStyle='#ffdd99'; ctx.font='bold 18px monospace'; ctx.fillText(weaponsLib[it.weaponIdx].emoji, x+6, y+20); }
                for(let m of medkits){ let x=m.x-camera.x, y=m.y-camera.y; if(x<-20||x>canvas.width+20) continue; ctx.fillStyle='#4caf50'; ctx.fillRect(x,y,m.w,m.h); ctx.fillStyle='#fff'; ctx.font='bold 16px monospace'; ctx.fillText("+", x+6, y+16); }
            }
            function drawPlayer() {
                let px=player.x-camera.x, py=player.y-camera.y, cx=px+PLAYER_W/2, cy=py+PLAYER_H/2;
                ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(cx+3,cy+6,20,10,0,0,Math.PI*2); ctx.fill();
                let step=Math.sin(player.anim*Math.PI)*2;
                ctx.fillStyle='#628e84'; ctx.beginPath(); ctx.ellipse(cx, cy+3+step*0.2, 17,19,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#c9894b'; ctx.fillRect(cx-11, cy+5+step*0.1,22,5);
                ctx.fillStyle='#4f786c'; ctx.beginPath(); ctx.ellipse(cx, cy-8+step*0.1,14,15,0,0,Math.PI*2); ctx.fill();
                let eyeX=(player.dirX!==0)?player.dirX*2:0, eyeY=(player.dirY!==0)?player.dirY*1.6:1;
                ctx.fillStyle='#faf4e0'; ctx.beginPath(); ctx.ellipse(cx-7+eyeX*0.4, cy-11+eyeY*0.6+step*0.05,3.8,4.5,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(cx+5+eyeX*0.4, cy-11+eyeY*0.6+step*0.05,3.8,4.5,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#1f2f28'; ctx.beginPath(); ctx.ellipse(cx-7+eyeX, cy-10+eyeY*0.8+step*0.05,2,2.5,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(cx+5+eyeX, cy-10+eyeY*0.8+step*0.05,2,2.5,0,0,Math.PI*2); ctx.fill();
                if(meleeSwing.active){ let ang=meleeSwing.angle, ax=meleeSwing.x-camera.x, ay=meleeSwing.y-camera.y; ctx.beginPath(); ctx.arc(ax, ay, 34, ang-0.9, ang+0.9); ctx.strokeStyle='#ffdd88'; ctx.lineWidth=6; ctx.stroke(); ctx.beginPath(); ctx.arc(ax, ay, 34, ang-0.9, ang+0.9); ctx.strokeStyle='#ffaa33'; ctx.lineWidth=3; ctx.stroke(); }
                if(player.invTimer>0 && (Math.floor(Date.now()/50)%2===0)) ctx.globalAlpha=0.5;
            }
            function drawProjectiles() { for(let p of projectiles){ let sx=p.x-camera.x, sy=p.y-camera.y; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,sy,p.size,0,Math.PI*2); ctx.fill(); } }
            function drawParticles(){ for(let p of particles){ let sx=p.x-camera.x, sy=p.y-camera.y; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,sy,3,0,Math.PI*2); ctx.fill(); } }
            
            function showDeath() {
                if(!gameActive) return;
                gameActive = false;
                let div = document.createElement('div'); div.className = 'death-screen';
                div.innerHTML = '<div class="death-window"><h2>💀 ВЫ ПОВЕРЖЕНЫ 💀</h2><button id="restart">Возродиться</button></div>';
                document.body.appendChild(div); document.getElementById('restart').onclick = () => location.reload();
            }
            
            // --- ГЛАВНЫЙ ЦИКЛ ---
            function gameLoop(now) {
                if (!gameActive) { requestAnimationFrame(gameLoop); return; }
                let delta = Math.min(0.033, (now - lastTimestamp) / 1000);
                if (delta > 0) {
                    updateCooldowns(delta);
                    updateProjectiles(delta);
                    updateEnemies(delta);
                    movePlayer();
                    checkPickup();
                    checkMedkits();
                    updateSpawning(delta);
                    if (player.hp <= 0) showDeath();
                }
                lastTimestamp = now;
                updateCamera();
                drawGround(); drawWalls(); drawDecor(); drawItems();
                for(let e of enemies) e.draw(camera);
                if(boss) boss.draw(camera);
                drawProjectiles();
                drawPlayer();
                drawParticles();
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#c0e0a020'; ctx.fillRect(0,0,canvas.width,canvas.height);
                requestAnimationFrame(gameLoop);
            }
            
            // --- ЗАПУСК ---
            scatterItems(); scatterMedkits();
            for(let i=0;i<5;i++) spawnEnemy();
            lastTimestamp = performance.now(); gameLoop(lastTimestamp);
        })();
    </script>
</body>
</html>
