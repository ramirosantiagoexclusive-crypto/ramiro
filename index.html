<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Invaders - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background: linear-gradient(180deg, #1a0033 0%, #330066 50%, #660033 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Comic Sans MS', cursive;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
        }
        canvas {
            border: 3px solid #ffcc00;
            box-shadow: 0 0 30px #ff6600;
            background: #0a0020;
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ffcc00;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000;
            font-weight: bold;
            z-index: 10;
        }
        #combo {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #ff3366;
            font-size: 20px;
            text-shadow: 2px 2px 0 #000;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }
        #message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 32px;
            text-shadow: 0 0 30px #00ffff, 3px 3px 0 #000;
            text-align: center;
            display: none;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }
        #gameOver, #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffcc00;
            font-size: 24px;
            text-shadow: 0 0 20px #ff6600, 3px 3px 0 #000;
            text-align: center;
            font-weight: bold;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #ffcc00;
        }
        h1 {
            font-size: 42px;
            color: #ff3366;
            text-shadow: 0 0 30px #ff3366, 4px 4px 0 #000;
            margin-bottom: 15px;
        }
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        
        /* Mobile controls */
        #mobileControls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        .controlBtn {
            width: 70px;
            height: 70px;
            background: rgba(255, 204, 0, 0.3);
            border: 3px solid #ffcc00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #ffcc00;
            touch-action: none;
        }
        .controlBtn:active {
            background: rgba(255, 204, 0, 0.6);
        }
        #fireBtn {
            width: 90px;
            height: 90px;
            background: rgba(255, 51, 102, 0.3);
            border-color: #ff3366;
            color: #ff3366;
        }
        #fireBtn:active {
            background: rgba(255, 51, 102, 0.6);
        }
        @media (max-width: 768px) {
            #mobileControls { display: flex; }
            #ui { font-size: 12px; }
            h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="game"></canvas>
        <div id="ui">
            <div>🍗 Очки: <span id="score">0</span></div>
            <div>❤️ Жизни: <span id="lives">3</span></div>
            <div> Волна: <span id="wave">1</span></div>
            <div> <span id="weapon">Двойное</span> <span id="weaponLevel">[1]</span></div>
        </div>
        <div id="combo">Комбо: x<span id="comboCount">0</span></div>
        <div id="message"></div>
        <div id="startScreen">
            <h1>🐔 CHICKEN INVADERS 🐔</h1>
            <p style="margin: 10px;">Уничтожь куриц!</p>
            <p> ПК: ← → или A D, ПРОБЕЛ</p>
            <p>📱 Телефон: экранные кнопки</p>
            <p>1, 2, 3 — смена оружия</p>
            <p class="blink" style="margin-top: 20px; font-size: 22px;">Нажми ENTER или коснись экрана</p>
        </div>
        <div id="gameOver" style="display: none;">
            <h1 style="color: #ff0000;">GAME OVER</h1>
            <div style="font-size: 22px;">Курицы победили!</div>
            <div style="font-size: 26px; margin: 15px; color: #ffcc00;">Очки: <span id="finalScore">0</span></div>
            <div style="font-size: 18px;">Волна: <span id="finalWave">1</span></div>
            <div class="blink" style="margin-top: 20px; font-size: 18px;">ENTER или касание — снова</div>
        </div>
        <div id="mobileControls">
            <div style="display: flex; gap: 10px;">
                <div class="controlBtn" id="leftBtn">️</div>
                <div class="controlBtn" id="rightBtn">️</div>
            </div>
            <div class="controlBtn" id="fireBtn">🔥</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;

        let gameState = 'start';
        let score = 0;
        let lives = 3;
        let wave = 1;
        let frameCount = 0;
        let combo = 0;
        let comboTimer = 0;
        let waveInProgress = false;  // Флаг: волна активна

        const keys = {};
        const player = {
            x: 400, y: 540,
            speed: 7, shootCooldown: 0, invulnerable: 0,
            weapon: 'double', weaponLevel: 1,
            weapons: {
                double: { name: 'Двойное', maxLevel: 3 },
                spread: { name: 'Веер', maxLevel: 3 },
                laser: { name: 'Лазер', maxLevel: 3 },
                missile: { name: 'Ракеты', maxLevel: 2 }
            }
        };

        let bullets = [];
        let eggs = [];
        let chickens = [];
        let particles = [];
        let powerUps = [];
        let floatingTexts = [];
        let stars = [];
        let boss = null;

        let formation = { 
            dir: 1, speed: 0.4, dropDown: false, dropCooldown: 0, baseY: 80
        };

        const funnyMessages = [
            "КУРИЦЫ АТАКУЮТ!", "ОНИ ВЕРНУЛИСЬ!", "ЕЩЁ БОЛЬШЕ КУРИЦ!",
            "БЕГИТЕ, КУРЫ!", "ЯЙЦА ЛЕТЯТ!", "КУРО-АПОКАЛИПСИС!"
        ];

        for (let i = 0; i < 80; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1 + 0.3,
                color: Math.random() < 0.3 ? '#ffcc00' : '#ffffff'
            });
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'Enter') {
                if (gameState === 'start' || gameState === 'gameOver') startGame();
            }
            if (e.key === '1') switchWeapon('double');
            if (e.key === '2' && player.weapons.spread) switchWeapon('spread');
            if (e.key === '3' && player.weapons.laser) switchWeapon('laser');
            if (e.key === '4' && player.weapons.missile) switchWeapon('missile');
            if ([' ', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
        });
        document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Touch controls for mobile
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const fireBtn = document.getElementById('fireBtn');

        function handleTouch(btn, key, value) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mousedown', (e) => { keys[key] = true; });
            btn.addEventListener('mouseup', (e) => { keys[key] = false; });
            btn.addEventListener('mouseleave', (e) => { keys[key] = false; });
        }

        handleTouch(leftBtn, 'arrowleft');
        handleTouch(rightBtn, 'arrowright');
        handleTouch(fireBtn, ' ');

        // Tap to start on mobile
        canvas.addEventListener('touchstart', (e) => {
            if (gameState === 'start' || gameState === 'gameOver') {
                e.preventDefault();
                startGame();
            }
        });

        function switchWeapon(type) {
            if (player.weapons[type]) {
                player.weapon = type;
                updateWeaponUI();
            }
        }

        function updateWeaponUI() {
            const names = { 
                double: 'Двойное', 
                spread: 'Веер', 
                laser: 'Лазер',
                missile: 'Ракеты'
            };
            document.getElementById('weapon').textContent = names[player.weapon];
            document.getElementById('weaponLevel').textContent = '[' + player.weaponLevel + ']';
        }

        function startGame() {
            gameState = 'playing';
            score = 0; 
            lives = 3; 
            wave = 1; 
            combo = 0;
            frameCount = 0;
            waveInProgress = false;
            player.x = 400; 
            player.invulnerable = 0;
            player.weapon = 'double'; 
            player.weaponLevel = 1;
            player.weapons = {
                double: { name: 'Двойное', maxLevel: 3 },
                spread: { name: 'Веер', maxLevel: 3 },
                laser: { name: 'Лазер', maxLevel: 3 },
                missile: { name: 'Ракеты', maxLevel: 2 }
            };
            bullets = []; 
            eggs = []; 
            chickens = []; 
            particles = [];
            powerUps = []; 
            floatingTexts = []; 
            boss = null;
            formation.speed = 0.4;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            updateWeaponUI();
            document.getElementById('combo').style.opacity = '0';
            showMessage("🛡️ ГОТОВЬСЯ К БОЮ!");
            setTimeout(() => spawnWave(), 2500);
        }

        function showMessage(text, duration = 2000) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, duration);
        }

        function spawnWave() {
            if (waveInProgress) return;
            waveInProgress = true;
            
            chickens = [];
            eggs = [];
            boss = null;

            if (wave % 5 === 0) {
                boss = {
                    x: 400, y: -150, targetY: 120,
                    width: 120, height: 100,
                    health: 50 + wave * 10, 
                    maxHealth: 50 + wave * 10,
                    attackCooldown: 120,
                    moving: true
                };
                showMessage("⚠️ БОСС!", 3000);
                return;
            }

            const rows = Math.min(2 + Math.floor((wave - 1) / 3), 4);
            const cols = Math.min(5 + Math.floor((wave - 1) / 4), 8);
            const startX = (canvas.width - cols * 90) / 2 + 45;
            const startY = formation.baseY;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let type = 'normal';
                    const rand = Math.random();
                    
                    if (wave > 3 && rand < 0.08) type = 'kamikaze';
                    else if (wave > 5 && rand < 0.12) type = 'shooter';
                    else if (wave > 7 && rand < 0.08) type = 'armored';
                    else if (r === 0 && wave > 2) type = 'king';

                    chickens.push({
                        x: startX + c * 90,
                        y: startY + r * 75,
                        width: 50, height: 40,
                        health: type === 'armored' ? 3 : 1 + Math.floor(wave / 5),
                        maxHealth: type === 'armored' ? 3 : 1 + Math.floor(wave / 5),
                        type: type,
                        wingPhase: Math.random() * Math.PI * 2,
                        eggCooldown: Math.random() * 400 + 300,
                        hitFlash: 0,
                        diveTimer: type === 'kamikaze' ? Math.random() * 300 + 200 : 0
                    });
                }
            }
            
            formation.dir = 1;
            formation.speed = 0.3 + wave * 0.05;
            formation.dropDown = false;
            formation.dropCooldown = 120;
            
            const waveName = wave === 1 ? "🎯 ВОЛНА 1!" : 
                            wave === 2 ? "🎯 ВОЛНА 2!" : 
                            `⚡ ВОЛНА ${wave}!`;
            showMessage(waveName + " " + funnyMessages[Math.floor(Math.random() * funnyMessages.length)], 2500);
        }

        function createParticles(x, y, color, count, type = 'normal') {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 3;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 50 + Math.random() * 30,
                    maxLife: 80,
                    color: color,
                    size: Math.random() * 5 + 3,
                    type: type,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.4
                });
            }
        }

        function addFloatingText(x, y, text, color, size = 20) {
            floatingTexts.push({ x, y, text, color, life: 60, vy: -2, size });
        }

        function drawChicken(ch) {
            ctx.save();
            ctx.translate(ch.x, ch.y);
            const wingFlap = Math.sin(ch.wingPhase + frameCount * 0.08) * 0.25;
            ctx.translate(0, Math.sin(frameCount * 0.04 + ch.x * 0.01));

            if (ch.hitFlash > 0) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffffff';
            }

            let bodyColor = '#fff5e6';
            if (ch.type === 'king') bodyColor = '#ffdd44';
            else if (ch.type === 'kamikaze') bodyColor = '#ff6666';
            else if (ch.type === 'shooter') bodyColor = '#66ff66';
            else if (ch.type === 'armored') bodyColor = '#aaaaaa';

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 22, 20, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ff9900';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-8, 15); ctx.lineTo(-10, 22);
            ctx.moveTo(8, 15); ctx.lineTo(10, 22);
            ctx.stroke();

            ctx.save();
            ctx.rotate(wingFlap);
            ctx.fillStyle = ch.type === 'king' ? '#ffcc00' : '#ffffff';
            ctx.beginPath();
            ctx.ellipse(-18, 0, 10, 14, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.rotate(-wingFlap);
            ctx.fillStyle = ch.type === 'king' ? '#ffcc00' : '#ffffff';
            ctx.beginPath();
            ctx.ellipse(18, 0, 10, 14, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = ch.hitFlash > 0 ? '#ffffff' : bodyColor;
            ctx.beginPath();
            ctx.ellipse(0, 5, 20, 16, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#663300';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            if (ch.type === 'armored') {
                ctx.strokeStyle = '#666666';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 5, 22, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = ch.hitFlash > 0 ? '#ffffff' : bodyColor;
            ctx.beginPath();
            ctx.arc(0, -12, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ff2244';
            ctx.beginPath();
            ctx.moveTo(-6, -22);
            ctx.quadraticCurveTo(-4, -28, -2, -22);
            ctx.quadraticCurveTo(0, -30, 2, -22);
            ctx.quadraticCurveTo(4, -28, 6, -22);
            ctx.closePath();
            ctx.fill();

            if (ch.type === 'king') {
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.moveTo(-8, -30);
                ctx.lineTo(-6, -36);
                ctx.lineTo(-3, -32);
                ctx.lineTo(0, -38);
                ctx.lineTo(3, -32);
                ctx.lineTo(6, -36);
                ctx.lineTo(8, -30);
                ctx.closePath();
                ctx.fill();
            }

            if (ch.type === 'kamikaze') {
                ctx.fillStyle = '#ff0000';
            } else {
                ctx.fillStyle = '#ffffff';
            }
            ctx.beginPath();
            ctx.arc(-5, -13, 3, 0, Math.PI * 2);
            ctx.arc(5, -13, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-5, -13, 1.5, 0, Math.PI * 2);
            ctx.arc(5, -13, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff9900';
            ctx.beginPath();
            ctx.moveTo(-3, -8);
            ctx.lineTo(3, -8);
            ctx.lineTo(0, -3);
            ctx.closePath();
            ctx.fill();

            if (ch.maxHealth > 1) {
                const barW = 40;
                const hpRatio = ch.health / ch.maxHealth;
                ctx.fillStyle = '#330000';
                ctx.fillRect(-barW/2, -38, barW, 4);
                ctx.fillStyle = hpRatio > 0.5 ? '#00ff00' : hpRatio > 0.25 ? '#ffcc00' : '#ff0000';
                ctx.fillRect(-barW/2, -38, barW * hpRatio, 4);
            }

            ctx.restore();
        }

        function drawBoss() {
            if (!boss) return;
            ctx.save();
            ctx.translate(boss.x, boss.y);

            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ff0000';
            ctx.fillStyle = '#ff3366';
            ctx.beginPath();
            ctx.ellipse(0, 0, 60, 50, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-25, -15, 12, 0, Math.PI * 2);
            ctx.arc(25, -15, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(-25, -15, 6, 0, Math.PI * 2);
            ctx.arc(25, -15, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff9900';
            ctx.beginPath();
            ctx.moveTo(-15, 10);
            ctx.lineTo(15, 10);
            ctx.lineTo(0, 30);
            ctx.closePath();
            ctx.fill();

            const barW = 150;
            const hpRatio = boss.health / boss.maxHealth;
            ctx.fillStyle = '#330000';
            ctx.fillRect(-barW/2, -80, barW, 8);
            ctx.fillStyle = hpRatio > 0.5 ? '#00ff00' : hpRatio > 0.25 ? '#ffcc00' : '#ff0000';
            ctx.fillRect(-barW/2, -80, barW * hpRatio, 8);

            ctx.restore();
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            if (player.invulnerable > 0 && Math.floor(frameCount / 4) % 2 === 0) {
                ctx.globalAlpha = 0.4;
            }

            const flameSize = 10 + Math.sin(frameCount * 0.3) * 2;
            const grad = ctx.createLinearGradient(0, 15, 0, 15 + flameSize);
            grad.addColorStop(0, '#ffff00');
            grad.addColorStop(0.5, '#ff6600');
            grad.addColorStop(1, 'rgba(255,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(-8, 15);
            ctx.lineTo(0, 15 + flameSize);
            ctx.lineTo(8, 15);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ccff';
            ctx.fillStyle = '#0088cc';
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(-25, 10);
            ctx.lineTo(-15, 15);
            ctx.lineTo(15, 15);
            ctx.lineTo(25, 10);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#66ffff';
            ctx.beginPath();
            ctx.ellipse(0, -5, 8, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function update() {
            if (gameState !== 'playing') return;
            frameCount++;

            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer === 0) {
                    combo = 0;
                    document.getElementById('combo').style.opacity = '0';
                }
            }

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            if (keys['arrowleft'] || keys['a']) player.x -= player.speed;
            if (keys['arrowright'] || keys['d']) player.x += player.speed;
            player.x = Math.max(30, Math.min(canvas.width - 30, player.x));

            if (player.shootCooldown > 0) player.shootCooldown--;
            if (player.invulnerable > 0) player.invulnerable--;

            // Улучшенная система стрельбы
            if (keys[' '] && player.shootCooldown <= 0) {
                fireWeapon();
            }

            bullets = bullets.filter(b => {
                b.y += b.vy;
                if (b.vx) b.x += b.vx;
                return b.y > -20 && b.x > -20 && b.x < canvas.width + 20;
            });

            if (boss) {
                if (boss.moving && boss.y < boss.targetY) {
                    boss.y += 1.5;
                } else {
                    boss.moving = false;
                    boss.x += Math.sin(frameCount * 0.02) * 2;
                    boss.attackCooldown--;
                    if (boss.attackCooldown <= 0) {
                        boss.attackCooldown = 80;
                        for (let i = -3; i <= 3; i++) {
                            eggs.push({
                                x: boss.x, y: boss.y + 50,
                                vy: 3.5, vx: i * 1.2,
                                rotation: 0, rotSpeed: 0.1
                            });
                        }
                    }
                }
            }

            let minX = Infinity, maxX = -Infinity;
            chickens.forEach(c => {
                minX = Math.min(minX, c.x);
                maxX = Math.max(maxX, c.x);
            });

            if (chickens.length > 0) {
                if (formation.dropCooldown > 0) formation.dropCooldown--;

                if (formation.dropDown && formation.dropCooldown <= 0) {
                    chickens.forEach(c => c.y += 10);
                    formation.dropDown = false;
                    formation.dir *= -1;
                    formation.dropCooldown = 40;
                } else if (!formation.dropDown) {
                    chickens.forEach(c => c.x += formation.dir * formation.speed);
                    if (maxX >= canvas.width - 30 || minX <= 30) {
                        formation.dropDown = true;
                    }
                }

                chickens.forEach(ch => {
                    ch.eggCooldown--;
                    if (ch.hitFlash > 0) ch.hitFlash--;

                    if (ch.type === 'kamikaze') {
                        ch.diveTimer--;
                        if (ch.diveTimer <= 0) {
                            ch.y += 4;
                            ch.x += Math.sin(frameCount * 0.1) * 2;
                        }
                    }

                    const eggChance = ch.type === 'shooter' ? 0.5 : 0.3;
                    if (ch.eggCooldown <= 0 && eggs.length < 12 && Math.random() < eggChance) {
                        ch.eggCooldown = ch.type === 'shooter' ? 180 : 300;
                        eggs.push({
                            x: ch.x, y: ch.y + 20,
                            vy: 2 + wave * 0.15,
                            vx: ch.type === 'shooter' ? (player.x - ch.x) * 0.008 : 0,
                            rotation: 0, rotSpeed: 0.1
                        });
                    }
                });
            }

            eggs = eggs.filter(e => {
                e.y += e.vy;
                if (e.vx) e.x += e.vx;
                e.rotation += e.rotSpeed;

                if (player.invulnerable <= 0 &&
                    Math.abs(e.x - player.x) < 20 && Math.abs(e.y - player.y) < 15) {
                    lives--;
                    player.invulnerable = 120;
                    combo = 0;
                    document.getElementById('combo').style.opacity = '0';
                    createParticles(e.x, e.y, '#ffff00', 20);
                    addFloatingText(player.x, player.y, 'ОЙ!', '#ff0000', 28);
                    if (lives <= 0) {
                        gameState = 'gameOver';
                        document.getElementById('finalScore').textContent = score;
                        document.getElementById('finalWave').textContent = wave;
                        document.getElementById('gameOver').style.display = 'block';
                    }
                    return false;
                }
                return e.y < canvas.height + 20;
            });

            // Столкновения пуль
            for (let bi = bullets.length - 1; bi >= 0; bi--) {
                const bullet = bullets[bi];
                let hit = false;

                chickens.forEach((ch, ci) => {
                    if (hit) return;
                    if (Math.abs(bullet.x - ch.x) < ch.width/2 &&
                        Math.abs(bullet.y - ch.y) < ch.height/2) {
                        if (bullet.type !== 'laser') {
                            bullets.splice(bi, 1);
                            hit = true;
                        }
                        ch.health--;
                        ch.hitFlash = 8;
                        createParticles(bullet.x, bullet.y, '#ffcc00', 5);

                        if (ch.health <= 0) {
                            combo++;
                            comboTimer = 180;
                            document.getElementById('comboCount').textContent = combo;
                            document.getElementById('combo').style.opacity = combo > 2 ? '1' : '0.5';

                            createParticles(ch.x, ch.y, '#ffffff', 15, 'feather');
                            const points = (ch.type === 'king' ? 100 : ch.type === 'armored' ? 50 : 10) * (1 + Math.floor(combo / 5));
                            score += points;
                            addFloatingText(ch.x, ch.y, '+' + points, '#ffcc00', 22);

                            if (combo > 0 && combo % 10 === 0) {
                                addFloatingText(ch.x, ch.y - 30, '🔥 КОМБО x' + combo + '!', '#ff3366', 28);
                            }

                            if (Math.random() < 0.15) {
                                const types = ['life', 'weapon_double', 'weapon_spread', 'weapon_laser', 'weapon_missile'];
                                powerUps.push({
                                    x: ch.x, y: ch.y,
                                    vy: 2, type: types[Math.floor(Math.random() * types.length)],
                                    rotation: 0
                                });
                            }
                            chickens.splice(ci, 1);
                        }
                    }
                });

                if (boss && !hit && Math.abs(bullet.x - boss.x) < boss.width/2 &&
                    Math.abs(bullet.y - boss.y) < boss.height/2) {
                    if (bullet.type !== 'laser') {
                        bullets.splice(bi, 1);
                    }
                    boss.health--;
                    createParticles(bullet.x, bullet.y, '#ff0000', 10);

                    if (boss.health <= 0) {
                        score += 1000 * wave;
                        addFloatingText(boss.x, boss.y, '+1000!', '#ff0000', 32);
                        createParticles(boss.x, boss.y, '#ff3366', 60);
                        boss = null;
                        showMessage(" БОСС УНИЧТОЖЕН!", 2000);
                        wave++;
                        waveInProgress = false;
                        setTimeout(() => spawnWave(), 3000);
                    }
                }
            }

            chickens.forEach(ch => {
                if (ch.y > canvas.height - 80) {
                    gameState = 'gameOver';
                    document.getElementById('finalScore').textContent = score;
                    document.getElementById('finalWave').textContent = wave;
                    document.getElementById('gameOver').style.display = 'block';
                }
            });

            // Подбор бонусов
            powerUps = powerUps.filter(p => {
                p.y += p.vy;
                p.rotation += 0.05;
                if (Math.abs(p.x - player.x) < 25 && Math.abs(p.y - player.y) < 20) {
                    if (p.type === 'life') {
                        lives = Math.min(lives + 1, 5);
                        addFloatingText(p.x, p.y, '+❤️', '#ff3366', 24);
                    } else if (p.type.startsWith('weapon_')) {
                        const weaponType = p.type.replace('weapon_', '');
                        if (player.weapons[weaponType]) {
                            if (player.weapon === weaponType && player.weaponLevel < 3) {
                                player.weaponLevel++;
                                addFloatingText(p.x, p.y, 'УРОВЕНЬ ' + player.weaponLevel + '!', '#00ffff', 24);
                            } else if (player.weapon !== weaponType) {
                                player.weapon = weaponType;
                                player.weaponLevel = 1;
                                addFloatingText(p.x, p.y, 'НОВОЕ ОРУЖИЕ!', '#00ff00', 24);
                            }
                            updateWeaponUI();
                        }
                    }
                    createParticles(p.x, p.y, '#00ff00', 25);
                    return false;
                }
                return p.y < canvas.height;
            });

            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.vx *= 0.98;
                p.rotation += p.rotSpeed;
                p.life--;
                return p.life > 0;
            });

            floatingTexts = floatingTexts.filter(t => {
                t.y += t.vy;
                t.life--;
                return t.life > 0;
            });

            // Переход на следующую волну
            if (chickens.length === 0 && !boss && gameState === 'playing' && waveInProgress) {
                const msg = document.getElementById('message');
                if (msg.style.display === 'none') {
                    wave++;
                    showMessage("✅ ВОЛНА ПРОЙДЕНА!", 1500);
                    waveInProgress = false;
                    setTimeout(() => spawnWave(), 2000);
                }
            }

            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('wave').textContent = wave;
        }

        function fireWeapon() {
            const level = player.weaponLevel;
            const cooldown = 15 - level * 2;
            player.shootCooldown = cooldown;

            switch(player.weapon) {
                case 'double':
                    const offset = level === 1 ? 12 : level === 2 ? 15 : 20;
                    const count = level === 1 ? 2 : level === 2 ? 3 : 4;
                    for (let i = 0; i < count; i++) {
                        bullets.push({ 
                            x: player.x - offset + (offset * 2 * i / (count - 1)), 
                            y: player.y - 15, 
                            vy: -10 - level, 
                            type: 'normal' 
                        });
                    }
                    break;
                    
                case 'spread':
                    const spreadCount = level === 1 ? 3 : level === 2 ? 5 : 7;
                    const spreadAngle = level === 1 ? 2 : level === 2 ? 3 : 4;
                    for (let i = -spreadCount; i <= spreadCount; i++) {
                        bullets.push({ 
                            x: player.x, 
                            y: player.y - 15, 
                            vy: -10, 
                            vx: i * spreadAngle, 
                            type: 'normal' 
                        });
                    }
                    break;
                    
                case 'laser':
                    const laserWidth = level === 1 ? 4 : level === 2 ? 6 : 8;
                    const laserCount = level === 1 ? 1 : level === 2 ? 2 : 3;
                    for (let i = 0; i < laserCount; i++) {
                        bullets.push({ 
                            x: player.x - 10 + (i * 10), 
                            y: player.y - 15, 
                            vy: -15 - level, 
                            type: 'laser', 
                            width: laserWidth 
                        });
                    }
                    break;
                    
                case 'missile':
                    const missileCount = level === 1 ? 1 : 2;
                    for (let i = 0; i < missileCount; i++) {
                        setTimeout(() => {
                            if (gameState === 'playing') {
                                bullets.push({ 
                                    x: player.x + (i === 0 ? -15 : 15), 
                                    y: player.y - 15, 
                                    vy: -8, 
                                    vx: 0,
                                    type: 'missile',
                                    homing: true,
                                    targetX: chickens.length > 0 ? chickens[0].x : player.x
                                });
                            }
                        }, i * 100);
                    }
                    break;
            }
        }

        function draw() {
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#0a0020');
            bgGrad.addColorStop(0.5, '#1a0040');
            bgGrad.addColorStop(1, '#330033');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                ctx.fillStyle = star.color;
                ctx.globalAlpha = 0.7;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;

            if (gameState === 'playing' || gameState === 'gameOver') {
                chickens.forEach(drawChicken);
                drawBoss();

                bullets.forEach(b => {
                    ctx.shadowBlur = 15;
                    if (b.type === 'laser') {
                        ctx.shadowColor = '#ff00ff';
                        ctx.fillStyle = '#ff00ff';
                        ctx.fillRect(b.x - b.width/2, b.y, b.width, 20);
                    } else if (b.type === 'missile') {
                        ctx.shadowColor = '#ff6600';
                        ctx.fillStyle = '#ff6600';
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.shadowColor = '#00ffff';
                        ctx.fillStyle = '#00ffff';
                        ctx.fillRect(b.x - 2, b.y, 4, 12);
                    }
                });
                ctx.shadowBlur = 0;

                eggs.forEach(e => {
                    ctx.save();
                    ctx.translate(e.x, e.y);
                    ctx.rotate(e.rotation);
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffff00';
                    ctx.fillStyle = '#fff8e0';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 8, 11, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                powerUps.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.shadowBlur = 20;
                    if (p.type === 'life') {
                        ctx.shadowColor = '#ff3366';
                        ctx.fillStyle = '#ff3366';
                        ctx.beginPath();
                        ctx.moveTo(0, 5);
                        ctx.bezierCurveTo(-15, -5, -15, -15, 0, -8);
                        ctx.bezierCurveTo(15, -15, 15, -5, 0, 5);
                        ctx.fill();
                    } else {
                        ctx.shadowColor = '#00ffff';
                        ctx.fillStyle = '#00ffff';
                        ctx.font = 'bold 20px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('W', 0, 5);
                    }
                    ctx.restore();
                });

                drawPlayer();

                particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.life / p.maxLife;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = p.color;
                    if (p.type === 'feather') {
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 2, 6, 0, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    }
                    ctx.restore();
                });
                ctx.globalAlpha = 1;

                floatingTexts.forEach(t => {
                    ctx.save();
                    ctx.globalAlpha = Math.min(1, t.life / 30);
                    ctx.font = 'bold ' + t.size + 'px Comic Sans MS';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = t.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = t.color;
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 3;
                    ctx.strokeText(t.text, t.x, t.y);
                    ctx.fillText(t.text, t.x, t.y);
                    ctx.restore();
                });
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
