<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2.5D Adventure - Mobile Ready</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a2a22;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .move-zone {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 50%;
            height: 100%;
            touch-action: none;
            z-index: 100;
        }
        .attack-zone {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 50%;
            height: 100%;
            touch-action: none;
            z-index: 100;
        }
        .joystick {
            position: absolute;
            bottom: 40px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(30,45,40,0.7);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(200,180,100,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        .joystick-base {
            width: 90px;
            height: 90px;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            position: relative;
        }
        .joystick-thumb {
            width: 45px;
            height: 45px;
            background: #d4c29b;
            border-radius: 50%;
            position: absolute;
            top: 22.5px;
            left: 22.5px;
            box-shadow: 0 2px 8px black;
            transition: transform 0.02s;
        }
        .aim-dot {
            position: fixed;
            width: 20px;
            height: 20px;
            background: #ffcc66;
            border-radius: 50%;
            border: 2px solid white;
            transform: translate(-50%,-50%);
            pointer-events: none;
            z-index: 200;
            display: none;
        }
        .ui {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
            display: flex;
            gap: 15px;
            font-size: 14px;
        }
        .weapon-info {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            color: #ffcc66;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
            font-size: 14px;
        }
        .reload-bar {
            position: fixed;
            bottom: 120px;
            right: 30px;
            width: 60px;
            height: 6px;
            background: #444;
            border-radius: 3px;
            overflow: hidden;
            z-index: 100;
        }
        .reload-fill {
            width: 100%;
            height: 100%;
            background: #ffaa44;
            transition: width 0.05s;
        }
        .boss-bar {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 16px;
            background: #422;
            border-radius: 10px;
            border: 1px solid #c99;
            overflow: hidden;
            z-index: 100;
            display: none;
        }
        .boss-fill {
            width: 100%;
            height: 100%;
            background: #e44;
        }
        .death-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }
        .death-window {
            background: #2a1f1a;
            padding: 20px 30px;
            border-radius: 30px;
            text-align: center;
            color: #ffaa88;
            border: 2px solid #ff8844;
        }
        .death-window button {
            background: #ff8844;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .joystick { width: 100px; height: 100px; bottom: 25px; left: 20px; }
            .joystick-base { width: 75px; height: 75px; }
            .joystick-thumb { width: 38px; height: 38px; top: 18.5px; left: 18.5px; }
            .reload-bar { bottom: 100px; }
        }
        .instruction {
            position: fixed;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            color: #ccc;
            font-size: 10px;
            background: rgba(0,0,0,0.4);
            width: fit-content;
            margin: 0 auto;
            padding: 2px 8px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="move-zone" id="moveZone">
        <div class="joystick">
            <div class="joystick-base"><div class="joystick-thumb" id="thumb"></div></div>
        </div>
    </div>
    <div class="attack-zone" id="attackZone"></div>
    <div class="aim-dot" id="aimDot"></div>
    <div class="ui">❤️ <span id="hp">100</span> &nbsp;| 🧟 <span id="kills">0</span></div>
    <div class="weapon-info" id="weaponInfo">🗡️ Меч (28)</div>
    <div class="reload-bar"><div class="reload-fill" id="reloadFill"></div></div>
    <div class="boss-bar" id="bossBar"><div class="boss-fill" id="bossFill"></div></div>
    <div class="instruction">👉 Левая половина — движение | Правая — прицел (вести) и отпустить для атаки</div>

    <script>
        (function(){
            // ---------- МИР ----------
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const WORLD_W = 2400;
            const WORLD_H = 2000;
            const PLAYER_W = 34, PLAYER_H = 34;
            const SPEED = 5.2;

            let player = {
                x: WORLD_W/2, y: WORLD_H/2,
                dirX: 0, dirY: 1,
                anim: 0,
                hp: 100, maxHp: 100,
                invTimer: 0,
                kills: 0
            };

            // ---------- ОРУЖИЕ ----------
            let weapon = {
                type: 0,
                name: "Меч",
                damage: 28,
                cd: 0,
                delay: 0.5,
                range: 75,
                projSpeed: 0,
                color: "#c0a16b",
                emoji: "🗡️"
            };
            const weapons = [
                { type:0, name:"Меч", damage:28, delay:0.5, range:75, projSpeed:0, color:"#c0a16b", emoji:"🗡️" },
                { type:1, name:"Арбалет", damage:18, delay:0.8, range:500, projSpeed:9, color:"#b87c4f", emoji:"🏹" },
                { type:2, name:"Посох", damage:42, delay:1.1, range:550, projSpeed:7, color:"#aa66ff", emoji:"🔮" }
            ];

            let projectiles = [];
            let meleeSwing = { active: false, angle: 0, timer: 0, duration: 0.15, x:0, y:0 };

            // ---------- ВРАГИ ----------
            let enemies = [];
            class Enemy {
                constructor(x,y){
                    this.x=x; this.y=y; this.w=32; this.h=32;
                    this.hp=45; this.maxHp=45;
                    this.speed=1.3;
                    this.attackTimer=0;
                }
                update(){
                    let dx = player.x+PLAYER_W/2 - (this.x+this.w/2);
                    let dy = player.y+PLAYER_H/2 - (this.y+this.h/2);
                    let len = Math.hypot(dx,dy);
                    if(len>0.1){ dx/=len; dy/=len; this.x+=dx*this.speed; this.y+=dy*this.speed; }
                    this.x = Math.min(Math.max(this.x,0), WORLD_W-this.w);
                    this.y = Math.min(Math.max(this.y,0), WORLD_H-this.h);
                    if(this.attackTimer<=0 && Math.hypot(this.x+this.w/2 - (player.x+PLAYER_W/2), this.y+this.h/2 - (player.y+PLAYER_H/2))<40){
                        player.hp -= 12;
                        player.invTimer = 0.7;
                        this.attackTimer = 0.8;
                    }
                    if(this.attackTimer>0) this.attackTimer -= 1/60;
                }
                draw(cam){
                    let x=this.x-cam.x, y=this.y-cam.y;
                    if(x+this.w<0 || x>canvas.width || y+this.h<0 || y>canvas.height) return;
                    ctx.fillStyle='rgba(0,0,0,0.4)';
                    ctx.beginPath(); ctx.ellipse(x+this.w/2+2, y+this.h-3, this.w/2+4,6,0,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#4a6e5c'; ctx.fillRect(x,y,this.w,this.h);
                    ctx.fillStyle='#2f5442'; ctx.fillRect(x+5,y-5,this.w-10,8);
                    ctx.fillStyle='#ffaaaa'; ctx.beginPath(); ctx.arc(x+this.w*0.3, y+this.h*0.4,4,0,Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x+this.w*0.7, y+this.h*0.4,4,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(x+this.w*0.3-1, y+this.h*0.4-1,1.5,0,Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x+this.w*0.7-1, y+this.h*0.4-1,1.5,0,Math.PI*2); ctx.fill();
                    let pct = this.hp/this.maxHp;
                    ctx.fillStyle='#900'; ctx.fillRect(x, y-8, this.w, 4);
                    ctx.fillStyle='#0a0'; ctx.fillRect(x, y-8, this.w*pct, 4);
                }
            }

            let spawnTimer = 0;
            function spawnEnemy(){
                let x = player.x + (Math.random()-0.5)*700;
                let y = player.y + (Math.random()-0.5)*700;
                x = Math.min(Math.max(x,80), WORLD_W-80);
                y = Math.min(Math.max(y,80), WORLD_H-80);
                if(Math.hypot(x-player.x, y-player.y) < 150) return;
                enemies.push(new Enemy(x,y));
            }

            // ---------- БОСС ----------
            let boss = null;
            class Boss {
                constructor(x,y){
                    this.x=x; this.y=y; this.w=70; this.h=70;
                    this.hp=300; this.maxHp=300;
                    this.phase=1;
                    this.attackTimer=0;
                    this.cooldown=1.8;
                    this.projectiles=[];
                }
                update(){
                    if(this.attackTimer<=0){
                        if(this.phase===1){
                            let dx = player.x+PLAYER_W/2 - (this.x+this.w/2);
                            let dy = player.y+PLAYER_H/2 - (this.y+this.h/2);
                            let len = Math.hypot(dx,dy);
                            if(len>0){ dx/=len; dy/=len; }
                            this.projectiles.push({ x:this.x+this.w/2, y:this.y+this.h/2, vx:dx*6, vy:dy*6, damage:25, size:10, color:"#ff6600" });
                        } else {
                            let ang = Math.atan2(player.y+PLAYER_H/2 - (this.y+this.h/2), player.x+PLAYER_W/2 - (this.x+this.w/2));
                            for(let i=-1;i<=1;i++){
                                let a = ang + i*0.5;
                                let vx = Math.cos(a)*6, vy = Math.sin(a)*6;
                                this.projectiles.push({ x:this.x+this.w/2, y:this.y+this.h/2, vx:vx, vy:vy, damage:22, size:9, color:"#ff8844" });
                            }
                        }
                        this.attackTimer = this.cooldown;
                    } else this.attackTimer -= 1/60;
                    for(let i=0;i<this.projectiles.length;i++){
                        let p = this.projectiles[i];
                        p.x+=p.vx; p.y+=p.vy;
                        if(p.x<0||p.x>WORLD_W||p.y<0||p.y>WORLD_H){ this.projectiles.splice(i,1); i--; continue; }
                        if(Math.hypot(p.x-(player.x+PLAYER_W/2), p.y-(player.y+PLAYER_H/2)) < 25){
                            player.hp -= p.damage;
                            player.invTimer = 0.5;
                            this.projectiles.splice(i,1); i--;
                        }
                    }
                    if(this.hp <= this.maxHp*0.5 && this.phase===1){
                        this.phase=2;
                        this.cooldown=1.2;
                    }
                }
                draw(cam){
                    let x=this.x-cam.x, y=this.y-cam.y;
                    if(x+this.w<0 || x>canvas.width || y+this.h<0 || y>canvas.height) return;
                    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(x+this.w/2+4, y+this.h-5, this.w/2+6,10,0,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#6a2c2c'; ctx.fillRect(x,y,this.w,this.h);
                    ctx.fillStyle='#a04040'; ctx.fillRect(x+5,y-10,this.w-10,12);
                    ctx.fillStyle='#ff8844'; ctx.beginPath(); ctx.arc(x+this.w*0.3, y+this.h*0.4,7,0,Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x+this.w*0.7, y+this.h*0.4,7,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#ff3333'; ctx.beginPath(); ctx.arc(x+this.w*0.3, y+this.h*0.4,3,0,Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x+this.w*0.7, y+this.h*0.4,3,0,Math.PI*2); ctx.fill();
                    let pct = this.hp/this.maxHp;
                    document.getElementById('bossFill').style.width = (pct*100)+'%';
                    for(let p of this.projectiles){
                        let sx=p.x-cam.x, sy=p.y-cam.y;
                        ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,sy,p.size,0,Math.PI*2); ctx.fill();
                    }
                }
                takeDamage(dmg){
                    this.hp -= dmg;
                    return this.hp<=0;
                }
            }
            function spawnBoss(){
                if(boss) return;
                boss = new Boss(WORLD_W/2, WORLD_H/2);
                document.getElementById('bossBar').style.display = 'block';
            }

            // ---------- ПРЕДМЕТЫ ОРУЖИЯ ----------
            let items = [];
            function addItem(x,y,idx){
                items.push({x,y,w:26,h:26,weaponIdx:idx});
            }
            function scatterItems(){
                for(let i=0;i<weapons.length;i++){
                    let placed=false;
                    for(let t=0;t<20;t++){
                        let x=150+Math.random()*(WORLD_W-300);
                        let y=150+Math.random()*(WORLD_H-300);
                        let ok=true;
                        for(let w of walls) if(x<w.x+w.w+30 && x+30>w.x && y<w.y+w.h+30 && y+30>w.y) ok=false;
                        if(ok && Math.hypot(x-player.x, y-player.y)>200){
                            addItem(x,y,i); placed=true; break;
                        }
                    }
                    if(!placed) addItem(500+i*200, 500+i*150, i);
                }
            }

            // ---------- СТЕНЫ ----------
            let walls = [];
            function addWall(x,y,w,h){ walls.push({x,y,w,h}); }
            addWall(200,300,70,70); addWall(450,500,60,60); addWall(700,200,80,80);
            addWall(1000,600,75,75); addWall(1300,350,70,70); addWall(1600,700,90,55);
            addWall(1900,400,80,80); addWall(2200,800,85,85); addWall(2500,300,70,70);
            addWall(300,1300,200,40); addWall(600,1400,40,180); addWall(900,1350,140,40);
            addWall(1200,1650,55,190); addWall(1500,1500,180,45); addWall(1800,1800,50,140);
            addWall(2100,1450,80,80); addWall(2300,1950,120,50); addWall(100,2000,80,80);
            addWall(300,2150,70,100); addWall(80,700,90,70); addWall(60,1100,80,80);
            addWall(2700,2050,100,90); addWall(2600,2250,110,60); addWall(2850,700,90,90);
            addWall(2750,400,120,55); addWall(2800,1400,75,130); addWall(1500,1150,100,100);
            addWall(1380,1050,55,135); addWall(1620,1080,55,125); addWall(900,2050,45,45);
            addWall(1150,2120,50,50); addWall(1950,2100,55,55); addWall(2250,650,50,50);
            addWall(2450,1900,60,60);

            let decor = [];
            for(let i=0;i<150;i++) decor.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H });

            // ---------- УПРАВЛЕНИЕ ДВИЖЕНИЕМ ----------
            let moveVec = {x:0,y:0}, moveActive=false;
            const thumb = document.getElementById('thumb');
            const moveZoneDiv = document.getElementById('moveZone');
            const baseRect = document.querySelector('.joystick-base');
            function onMoveStart(e){
                e.preventDefault();
                moveActive=true;
                updateMove(e);
            }
            function updateMove(e){
                if(!moveActive) return;
                const touch = e.touches ? e.touches[0] : e;
                const rect = baseRect.getBoundingClientRect();
                let dx = touch.clientX - (rect.left+rect.width/2);
                let dy = touch.clientY - (rect.top+rect.height/2);
                const maxD = rect.width/2;
                let dist = Math.hypot(dx,dy);
                if(dist>maxD){ dx=dx/dist*maxD; dy=dy/dist*maxD; }
                thumb.style.transform = `translate(${dx}px, ${dy}px)`;
                moveVec.x = dx/maxD;
                moveVec.y = dy/maxD;
            }
            function onMoveEnd(){
                moveActive=false;
                moveVec={x:0,y:0};
                thumb.style.transform = 'translate(0px,0px)';
            }
            moveZoneDiv.addEventListener('touchstart', onMoveStart);
            moveZoneDiv.addEventListener('mousedown', onMoveStart);
            window.addEventListener('touchmove', (e)=>{ if(moveActive){ e.preventDefault(); updateMove(e); } });
            window.addEventListener('mousemove', (e)=>{ if(moveActive) updateMove(e); });
            window.addEventListener('touchend', onMoveEnd);
            window.addEventListener('mouseup', onMoveEnd);

            // ---------- УПРАВЛЕНИЕ АТАКОЙ (ПРАВАЯ ЗОНА) ----------
            let aiming = false;
            let aimDir = { x:1, y:0 };
            const attackDiv = document.getElementById('attackZone');
            const aimDot = document.getElementById('aimDot');

            function getPlayerScreenCenter() {
                return {
                    x: player.x - camera.x + PLAYER_W/2,
                    y: player.y - camera.y + PLAYER_H/2
                };
            }

            function updateAimDirectionFromTouch(clientX, clientY) {
                const playerScreen = getPlayerScreenCenter();
                let dx = clientX - playerScreen.x;
                let dy = clientY - playerScreen.y;
                let len = Math.hypot(dx, dy);
                if (len > 0.001) {
                    aimDir.x = dx / len;
                    aimDir.y = dy / len;
                } else {
                    aimDir.x = 1; aimDir.y = 0;
                }
            }

            function onAimStart(e) {
                e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                aiming = true;
                // сразу устанавливаем направление от игрока к точке касания
                updateAimDirectionFromTouch(touch.clientX, touch.clientY);
                aimDot.style.display = 'block';
                aimDot.style.left = touch.clientX + 'px';
                aimDot.style.top = touch.clientY + 'px';
            }

            function onAimMove(e) {
                if (!aiming) return;
                e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                // обновляем направление прицела по движению пальца
                updateAimDirectionFromTouch(touch.clientX, touch.clientY);
                aimDot.style.left = touch.clientX + 'px';
                aimDot.style.top = touch.clientY + 'px';
            }

            function onAimEnd(e) {
                if (!aiming) return;
                e.preventDefault();
                aiming = false;
                aimDot.style.display = 'none';
                if (weapon.cd <= 0) {
                    performAttack(aimDir);
                }
            }

            attackDiv.addEventListener('touchstart', onAimStart);
            attackDiv.addEventListener('touchmove', onAimMove);
            attackDiv.addEventListener('touchend', onAimEnd);
            attackDiv.addEventListener('mousedown', onAimStart);
            attackDiv.addEventListener('mousemove', (e) => { if (aiming) onAimMove(e); });
            attackDiv.addEventListener('mouseup', onAimEnd);
            // для ПК быстрый клик
            attackDiv.addEventListener('click', (e) => {
                if (window.innerWidth > 768 && weapon.cd <= 0) {
                    updateAimDirectionFromTouch(e.clientX, e.clientY);
                    performAttack(aimDir);
                }
            });

            function performAttack(dir) {
                if (weapon.cd > 0) return;
                if (weapon.type === 0) { // melee
                    let ax = player.x + PLAYER_W/2;
                    let ay = player.y + PLAYER_H/2;
                    let hit = false;
                    for (let i = 0; i < enemies.length; i++) {
                        let e = enemies[i];
                        let ex = e.x + e.w/2, ey = e.y + e.h/2;
                        if (Math.hypot(ax - ex, ay - ey) < weapon.range) {
                            e.hp -= weapon.damage;
                            hit = true;
                            if (e.hp <= 0) {
                                enemies.splice(i,1);
                                player.kills++;
                                document.getElementById('kills').innerText = player.kills;
                                i--;
                            }
                        }
                    }
                    if (boss && Math.hypot(ax - (boss.x+boss.w/2), ay - (boss.y+boss.h/2)) < weapon.range+15) {
                        let dead = boss.takeDamage(weapon.damage);
                        if (dead) {
                            boss = null;
                            document.getElementById('bossBar').style.display = 'none';
                        }
                        hit = true;
                    }
                    if (hit) {
                        meleeSwing.active = true;
                        meleeSwing.timer = meleeSwing.duration;
                        meleeSwing.angle = Math.atan2(dir.y, dir.x);
                        meleeSwing.x = player.x + PLAYER_W/2;
                        meleeSwing.y = player.y + PLAYER_H/2;
                    }
                } else {
                    projectiles.push({
                        x: player.x + PLAYER_W/2, y: player.y + PLAYER_H/2,
                        vx: dir.x * weapon.projSpeed, vy: dir.y * weapon.projSpeed,
                        damage: weapon.damage, traveled: 0, range: weapon.range,
                        size: 7, color: weapon.color
                    });
                }
                weapon.cd = weapon.delay;
            }

            // ---------- КЛАВИАТУРА ДЛЯ ДВИЖЕНИЯ ----------
            let keyState = { w:false,s:false,a:false,d:false,ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false };
            window.addEventListener('keydown', (e)=>{
                let k = e.key;
                if (keyState.hasOwnProperty(k)) { keyState[k]=true; e.preventDefault(); }
                if (k === ' ') { e.preventDefault(); if (weapon.cd<=0) performAttack({x:player.dirX||1, y:player.dirY||0}); }
            });
            window.addEventListener('keyup', (e)=>{
                let k = e.key;
                if (keyState.hasOwnProperty(k)) keyState[k]=false;
            });

            // ---------- ЛОГИКА ДВИЖЕНИЯ ----------
            function movePlayer() {
                let mx = 0, my = 0;
                if (keyState.w || keyState.ArrowUp) my -= 1;
                if (keyState.s || keyState.ArrowDown) my += 1;
                if (keyState.a || keyState.ArrowLeft) mx -= 1;
                if (keyState.d || keyState.ArrowRight) mx += 1;
                if (moveVec.x !== 0 || moveVec.y !== 0) { mx += moveVec.x; my += moveVec.y; }
                let len = Math.hypot(mx, my);
                if (len > 0) { mx /= len; my /= len; }
                if (mx !== 0 || my !== 0) { player.dirX = mx; player.dirY = my; player.anim += 0.2; } else player.anim = 0;
                let newX = player.x + mx * SPEED;
                let newY = player.y + my * SPEED;
                if (!collision(newX, player.y, PLAYER_W, PLAYER_H)) player.x = newX;
                if (!collision(player.x, newY, PLAYER_W, PLAYER_H)) player.y = newY;
            }
            function collision(x,y,w,h){
                if (x<0 || y<0 || x+w>WORLD_W || y+h>WORLD_H) return true;
                for (let wa of walls) if (x<wa.x+wa.w && x+w>wa.x && y<wa.y+wa.h && y+h>wa.y) return true;
                return false;
            }

            // ---------- СНАРЯДЫ ----------
            function updateProjectiles() {
                for (let i=0;i<projectiles.length;i++) {
                    let p = projectiles[i];
                    p.x += p.vx; p.y += p.vy;
                    p.traveled += Math.hypot(p.vx, p.vy);
                    let hit = false;
                    for (let w of walls) if (p.x>w.x && p.x<w.x+w.w && p.y>w.y && p.y<w.y+w.h) { hit=true; break; }
                    if (p.traveled > p.range || hit || p.x<0 || p.x>WORLD_W || p.y<0 || p.y>WORLD_H) {
                        projectiles.splice(i,1); i--; continue;
                    }
                    for (let j=0;j<enemies.length;j++) {
                        let e = enemies[j];
                        if (p.x>e.x && p.x<e.x+e.w && p.y>e.y && p.y<e.y+e.h) {
                            e.hp -= p.damage;
                            projectiles.splice(i,1);
                            if (e.hp<=0) { enemies.splice(j,1); player.kills++; document.getElementById('kills').innerText=player.kills; j--; }
                            break;
                        }
                    }
                    if (boss && p.x>boss.x && p.x<boss.x+boss.w && p.y>boss.y && p.y<boss.y+boss.h) {
                        let dead = boss.takeDamage(p.damage);
                        projectiles.splice(i,1);
                        if (dead) { boss=null; document.getElementById('bossBar').style.display='none'; }
                    }
                }
            }

            // ---------- ПЕРЕЗАРЯДКА, ХП ----------
            let lastTime = 0;
            function updateCooldowns(delta) {
                if (weapon.cd > 0) {
                    weapon.cd -= delta;
                    let fill = 1 - weapon.cd/weapon.delay;
                    document.getElementById('reloadFill').style.width = (fill*100)+'%';
                } else document.getElementById('reloadFill').style.width = '100%';
                if (meleeSwing.active) {
                    meleeSwing.timer -= delta;
                    if (meleeSwing.timer <= 0) meleeSwing.active = false;
                }
                if (player.invTimer > 0) player.invTimer -= delta;
                if (player.hp > player.maxHp) player.hp = player.maxHp;
                document.getElementById('hp').innerText = Math.floor(player.hp);
            }

            // ---------- ПОДБОР ОРУЖИЯ ----------
            function checkPickup() {
                for (let i=0;i<items.length;i++) {
                    let it = items[i];
                    if (Math.abs(player.x - it.x) < 40 && Math.abs(player.y - it.y) < 40) {
                        let newW = weapons[it.weaponIdx];
                        weapon = { ...newW, cd: 0 };
                        document.getElementById('weaponInfo').innerHTML = `${newW.emoji} ${newW.name} (${newW.damage})`;
                        items.splice(i,1); break;
                    }
                }
            }

            // ---------- КАМЕРА ----------
            let camera = { x:0, y:0 };
            function updateCamera() {
                let tx = player.x + PLAYER_W/2 - canvas.width/2;
                let ty = player.y + PLAYER_H/2 - canvas.height/2;
                camera.x = Math.min(Math.max(0, tx), WORLD_W - canvas.width);
                camera.y = Math.min(Math.max(0, ty), WORLD_H - canvas.height);
            }

            // ---------- СПАВН ВРАГОВ И БОССА ----------
            function updateSpawning(delta) {
                if (boss) return;
                spawnTimer += delta;
                if (spawnTimer > 7 && enemies.length < 5) {
                    spawnTimer = 0;
                    spawnEnemy();
                }
                if (!boss && player.kills >= 5) spawnBoss();
                if (boss) boss.update();
            }

            // ---------- СМЕРТЬ ----------
            let gameActive = true;
            function showDeath() {
                if (!gameActive) return;
                gameActive = false;
                let div = document.createElement('div');
                div.className = 'death-screen';
                div.innerHTML = '<div class="death-window"><h2>💀 ВЫ ПОГИБЛИ 💀</h2><button id="restart">Возродиться</button></div>';
                document.body.appendChild(div);
                document.getElementById('restart').onclick = () => location.reload();
            }
            function checkDeath() {
                if (gameActive && player.hp <= 0) showDeath();
            }

            // ---------- ОТРИСОВКА ----------
            function drawGround() {
                let grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
                grad.addColorStop(0, '#5d9652'); grad.addColorStop(1, '#2b522c');
                ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);
                for (let i=0;i<600;i++) {
                    let wx = (i*311)%WORLD_W, wy = (i*457)%WORLD_H;
                    let sx = wx-camera.x, sy = wy-camera.y;
                    if (sx>0 && sx<canvas.width && sy>0 && sy<canvas.height) {
                        ctx.fillStyle = 'rgba(210,240,120,0.25)';
                        ctx.beginPath(); ctx.arc(sx,sy,1.5,0,Math.PI*2); ctx.fill();
                    }
                }
            }
            function drawWalls() {
                for (let w of walls) {
                    let x=w.x-camera.x, y=w.y-camera.y;
                    if (x+w.w<0 || x>canvas.width || y+w.h<0 || y>canvas.height) continue;
                    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(x+w.w/2+2, y+w.h-3, w.w/2+4,8,0,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#5f5035'; ctx.fillRect(x, y+22, w.w, w.h);
                    ctx.fillStyle='#b39d6b'; ctx.beginPath(); ctx.moveTo(x,y+22); ctx.lineTo(x+w.w,y+22); ctx.lineTo(x+w.w-5,y); ctx.lineTo(x+5,y); ctx.fill();
                    ctx.fillStyle='#473d28'; ctx.fillRect(x+w.w-6, y+20, 6, w.h);
                }
            }
            function drawDecor() {
                for (let d of decor) {
                    let x=d.x-camera.x, y=d.y-camera.y;
                    if (x>-50 && x<canvas.width+50 && y>-50 && y<canvas.height+50) {
                        ctx.fillStyle='#4c7a3a'; ctx.beginPath(); ctx.ellipse(x,y-4,10,7,0,0,Math.PI*2); ctx.fill();
                    }
                }
            }
            function drawItems() {
                for (let it of items) {
                    let x=it.x-camera.x, y=it.y-camera.y;
                    if (x<-30 || x>canvas.width+30) continue;
                    ctx.fillStyle='#ffcc77'; ctx.fillRect(x,y,it.w,it.h);
                    ctx.fillStyle='#aa8844'; ctx.fillRect(x+4,y+4,it.w-8,it.h-8);
                    ctx.fillStyle='#ffdd99'; ctx.font='bold 18px monospace'; ctx.fillText(weapons[it.weaponIdx].emoji, x+6, y+20);
                }
            }
            function drawPlayer() {
                let px=player.x-camera.x, py=player.y-camera.y;
                let cx=px+PLAYER_W/2, cy=py+PLAYER_H/2;
                ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(cx+3, cy+6, 20,10,0,0,Math.PI*2); ctx.fill();
                let step=Math.sin(player.anim*Math.PI)*2;
                ctx.fillStyle='#628e84'; ctx.beginPath(); ctx.ellipse(cx, cy+3+step*0.2, 17,19,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#c9894b'; ctx.fillRect(cx-11, cy+5+step*0.1,22,5);
                ctx.fillStyle='#4f786c'; ctx.beginPath(); ctx.ellipse(cx, cy-8+step*0.1,14,15,0,0,Math.PI*2); ctx.fill();
                let eyeX=(player.dirX!==0)?player.dirX*2:0, eyeY=(player.dirY!==0)?player.dirY*1.6:1;
                ctx.fillStyle='#faf4e0'; ctx.beginPath(); ctx.ellipse(cx-7+eyeX*0.4, cy-11+eyeY*0.6+step*0.05,3.8,4.5,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(cx+5+eyeX*0.4, cy-11+eyeY*0.6+step*0.05,3.8,4.5,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#1f2f28'; ctx.beginPath(); ctx.ellipse(cx-7+eyeX, cy-10+eyeY*0.8+step*0.05,2,2.5,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(cx+5+eyeX, cy-10+eyeY*0.8+step*0.05,2,2.5,0,0,Math.PI*2); ctx.fill();
                if (meleeSwing.active) {
                    let ang=meleeSwing.angle;
                    let ax=meleeSwing.x-camera.x, ay=meleeSwing.y-camera.y;
                    ctx.beginPath(); ctx.arc(ax, ay, 32, ang-0.8, ang+0.8);
                    ctx.strokeStyle='#ffdd88'; ctx.lineWidth=5; ctx.stroke();
                    ctx.beginPath(); ctx.arc(ax, ay, 32, ang-0.8, ang+0.8);
                    ctx.strokeStyle='#ffaa33'; ctx.lineWidth=2; ctx.stroke();
                }
            }
            function drawProjectiles() {
                for (let p of projectiles) {
                    let sx=p.x-camera.x, sy=p.y-camera.y;
                    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,sy,p.size,0,Math.PI*2); ctx.fill();
                }
            }
            function drawAim() {
                if (!aiming) return;
                let sx=player.x-camera.x+PLAYER_W/2, sy=player.y-camera.y+PLAYER_H/2;
                let ex=sx+aimDir.x*55, ey=sy+aimDir.y*55;
                ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey);
                ctx.strokeStyle='#ffcc88'; ctx.lineWidth=3; ctx.stroke();
                ctx.beginPath(); ctx.arc(ex,ey,7,0,Math.PI*2); ctx.fillStyle='#ffaa55aa'; ctx.fill();
            }

            // ---------- ГЛАВНЫЙ ЦИКЛ ----------
            function frame(now) {
                let delta = Math.min(0.033, (now - lastTime)/1000);
                if (delta > 0 && gameActive) {
                    updateCooldowns(delta);
                    updateProjectiles();
                    for (let e of enemies) e.update();
                    movePlayer();
                    checkPickup();
                    updateSpawning(delta);
                    checkDeath();
                }
                lastTime = now;
                updateCamera();
                drawGround();
                drawWalls();
                drawDecor();
                drawItems();
                for (let e of enemies) e.draw(camera);
                if (boss) boss.draw(camera);
                drawProjectiles();
                drawPlayer();
                drawAim();
                ctx.fillStyle = '#c0e0a020'; ctx.fillRect(0,0,canvas.width,canvas.height);
                requestAnimationFrame(frame);
            }

            // ИНИЦИАЛИЗАЦИЯ
            scatterItems();
            for (let i=0;i<4;i++) spawnEnemy();
            lastTime = performance.now();
            frame(lastTime);
        })();
    </script>
</body>
